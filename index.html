<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" id="vpMeta" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B111C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Depot Radar">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='38' fill='%230B111C'/%3E%3Cpath d='M28 118 L62 86 L88 104 L152 46' stroke='%233BC9F0' stroke-width='11' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='152' cy='46' r='13' fill='%232FD08C'/%3E%3C/svg%3E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230B111C'/%3E%3Cpath d='M10 42 L22 31 L31 37 L54 17' stroke='%233BC9F0' stroke-width='5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<title>Depot Radar · ETF & Aktien Trends</title>
<meta name="description" content="Persönliches Markt-Radar: Trends, Risiko-Einstufung und technische Signale für ETFs und Aktien. Keine Anlageberatung.">
<style>
/* ============ Design tokens — instrument-panel look ============ */
:root{
  --bg:#0B111C; --bg-glow:rgba(59,201,240,.07);
  --panel:#121B2B; --panel2:#0E1624; --line:#1F2D47; --grid:#16233A;
  --ink:#E8EEF7; --muted:#8CA0B8; --faint:#5C7089;
  --accent:#3BC9F0; --accent2:#8FE3FF;
  --up:#2FD08C; --down:#FF5D73; --warn:#FFB74D; --orange:#FF8A50;
  --sma50:#8FB4FF; --sma200:#FFB74D;
  --shadow:0 10px 30px rgba(0,0,0,.35);
  --r:14px; --r-s:9px;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Code",Consolas,"Roboto Mono",Menlo,monospace;
}
html[data-theme="light"]{
  --bg:#F2F5FA; --bg-glow:rgba(14,122,211,.05);
  --panel:#FFFFFF; --panel2:#F6F9FD; --line:#DDE5F0; --grid:#E9EFF7;
  --ink:#0F1B2D; --muted:#5B6B80; --faint:#8A99AC;
  --accent:#0E7AD3; --accent2:#0A9BD8;
  --up:#0E9E6B; --down:#D93B54; --warn:#B97511; --orange:#C25E1F;
  --sma50:#4C6FBF; --sma200:#B97511;
  --shadow:0 8px 22px rgba(15,40,80,.10);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--sans); color:var(--ink); background:var(--bg);
  background-image:radial-gradient(900px 420px at 50% -80px, var(--bg-glow), transparent 70%);
  background-attachment:fixed; min-height:100vh; line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
.mono{font-family:var(--mono); font-variant-numeric:tabular-nums}
a{color:var(--accent)}
button{font-family:inherit}
.hidden{display:none !important}

/* ============ Lock screen ============ */
#lockScreen{position:fixed; inset:0; z-index:60; display:flex; align-items:center; justify-content:center; padding:20px; background:var(--bg);
  background-image:radial-gradient(700px 400px at 50% 10%, var(--bg-glow), transparent 70%);}
.lock-card{width:100%; max-width:380px; background:var(--panel); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow); padding:26px 22px}
.lock-brand{display:flex; align-items:center; gap:10px; margin-bottom:6px}
.lock-brand .dot{width:10px;height:10px;border-radius:50%;background:var(--accent); box-shadow:0 0 12px var(--accent)}
.lock-brand h1{font-size:20px; letter-spacing:.14em; margin:0; font-weight:800}
.lock-hint{color:var(--muted); font-size:13.5px; margin:0 0 16px}
.lock-card label{display:block; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--faint); margin:12px 0 5px; font-family:var(--mono)}
.lock-card input[type=password]{width:100%; padding:11px 12px; border-radius:var(--r-s); border:1px solid var(--line); background:var(--panel2); color:var(--ink); font-size:16px}
.lock-card input:focus{outline:2px solid var(--accent); outline-offset:1px; border-color:transparent}
.lock-keep{display:flex; align-items:center; gap:8px; margin:14px 0 4px; font-size:13.5px; color:var(--muted)}
.lock-err{color:var(--down); font-size:13px; min-height:18px; margin:8px 0 0}
.lock-actions{margin-top:14px; display:flex; flex-direction:column; gap:10px}
.lock-forgot{background:none;border:none;color:var(--faint);font-size:12.5px;cursor:pointer;text-decoration:underline;padding:4px}
.pw-wrap{position:relative; display:block; flex:1; min-width:150px}
.pw-wrap input{width:100%; padding-right:38px}
.pw-eye{position:absolute; right:8px; top:50%; transform:translateY(-50%); background:none; border:none;
  color:var(--faint); cursor:pointer; font-size:15px; padding:4px 6px; line-height:1}
.pw-eye:hover{color:var(--accent)}

/* ============ Buttons ============ */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; cursor:pointer; border-radius:var(--r-s);
  border:1px solid var(--line); background:var(--panel2); color:var(--ink); padding:9px 14px; font-size:14px; text-decoration:none; transition:filter .15s, transform .05s}
.btn:hover{filter:brightness(1.12)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:#05121C; font-weight:700}
html[data-theme="light"] .btn.primary{color:#fff}
.btn.ghost{background:transparent}
.btn.danger{border-color:var(--down); color:var(--down)}
.btn.icon{padding:8px 10px; font-size:16px; line-height:1}
.btn:focus-visible, .chip:focus-visible, .tab:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

/* ============ Header ============ */
#appHeader{position:sticky; top:0; z-index:40; backdrop-filter:blur(10px);
  background:color-mix(in srgb, var(--bg) 82%, transparent); border-bottom:1px solid var(--line)}
.hd-in{max-width:1080px; margin:0 auto; padding:10px 14px; display:flex; align-items:center; gap:10px}
.brand{display:flex; align-items:baseline; gap:9px; margin-right:auto; min-width:0; overflow:hidden}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--up); box-shadow:0 0 10px var(--up); align-self:center; animation:pulse 2.4s infinite}
.brand .dot.busy{background:var(--warn); box-shadow:0 0 10px var(--warn)}
.brand .dot.err{background:var(--down); box-shadow:0 0 10px var(--down)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
@media (prefers-reduced-motion: reduce){ .brand .dot{animation:none} *{scroll-behavior:auto !important} }
.brand h1{font-size:16px; margin:0; font-weight:800; letter-spacing:.16em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.brand small{color:var(--faint); font-family:var(--mono); font-size:10.5px; letter-spacing:.06em; white-space:nowrap}
@media(max-width:560px){ .brand small{display:none} }
#lastUpdate{color:var(--faint); font-size:11px; font-family:var(--mono); margin-right:2px; white-space:nowrap}
@media(max-width:640px){ #lastUpdate{display:none} }

/* ============ Tabs ============ */
#tabbar{max-width:1080px; margin:0 auto; padding:8px 14px 9px; display:flex; gap:8px}
.tab{border:1px solid var(--line); background:var(--panel2); color:var(--muted); border-radius:999px; padding:8px 16px; font-size:13.5px; cursor:pointer; letter-spacing:.02em}
.tab.on{background:var(--accent); border-color:var(--accent); color:#05121C; font-weight:700}
html[data-theme="light"] .tab.on{color:#fff}
main{max-width:1080px; margin:0 auto; padding:14px 14px 40px}
.panel{display:none}
.panel.on{display:block; animation:fadein .18s ease}
@keyframes fadein{from{opacity:0; transform:translateY(3px)}to{opacity:1}}

/* ============ Banner & toast ============ */
#banner{margin:0 0 12px; padding:10px 14px; border-radius:var(--r-s); font-size:13.5px; border:1px solid var(--warn); color:var(--warn); background:color-mix(in srgb, var(--warn) 10%, transparent)}
#banner.err{border-color:var(--down); color:var(--down); background:color-mix(in srgb, var(--down) 10%, transparent)}
#toast{position:fixed; left:50%; bottom:26px; transform:translateX(-50%); z-index:70; background:var(--ink); color:var(--bg); padding:9px 16px; border-radius:999px; font-size:13.5px; box-shadow:var(--shadow); opacity:0; pointer-events:none; transition:opacity .2s}
#toast.show{opacity:1}

/* ============ Strips ============ */
.strips{display:flex; flex-direction:column; gap:8px; margin-bottom:14px}
.strip{display:flex; align-items:center; gap:8px}
/* the chips live in a span; without its own flex row they wrap into a column */
#stripTrend, #stripSteady, #stripCaution{
  flex:1 1 auto; min-width:0; display:flex; flex-wrap:nowrap; gap:8px;
  overflow-x:auto; padding-bottom:2px; scrollbar-width:thin; -webkit-overflow-scrolling:touch}
.strip-title{flex:0 0 auto; font-family:var(--mono); font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--faint); min-width:118px}
.strip-chip{flex:0 0 auto; display:inline-flex; align-items:center; gap:8px; border:1px solid var(--line); background:var(--panel); color:var(--ink); border-radius:999px; padding:6px 12px; font-size:12.5px; cursor:pointer}
.strip-chip .mono{font-size:12px}
.strip-chip:hover{border-color:var(--accent)}
.strip-empty{color:var(--faint); font-size:12.5px}

/* ============ Filter / sort row ============ */
.controls{display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-bottom:14px}
.chip{border:1px solid var(--line); background:var(--panel2); color:var(--muted); border-radius:999px; padding:6px 13px; font-size:13px; cursor:pointer}
.chip.on{border-color:var(--accent); color:var(--accent)}
.controls .spacer{flex:1}
.controls label{font-size:12.5px; color:var(--faint)}
select,input[type=text],input[type=number],input[type=password],textarea{
  border:1px solid var(--line); background:var(--panel2); color:var(--ink); border-radius:var(--r-s); padding:8px 10px; font-size:14px; font-family:inherit}
select{cursor:pointer}

/* ============ Cards (channel strips) ============ */
#cardGrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(330px,1fr)); gap:12px}
@media(max-width:380px){ #cardGrid{grid-template-columns:1fr} }
.card{position:relative; display:flex; background:var(--panel); border:1px solid var(--line); border-radius:var(--r); overflow:hidden; box-shadow:var(--shadow); transition:transform .12s, border-color .12s}
.card:hover{transform:translateY(-2px); border-color:color-mix(in srgb, var(--accent) 45%, var(--line))}
.rail{width:4px; flex:0 0 4px; background:var(--faint)}
.sig-strong .rail{background:var(--up)} .sig-positive .rail{background:color-mix(in srgb, var(--up) 65%, var(--warn))}
.sig-neutral .rail{background:var(--faint)} .sig-caution .rail{background:var(--warn)} .sig-weak .rail{background:var(--down)}
.card-main{flex:1; padding:13px 14px 12px; min-width:0}
.card-top{display:flex; justify-content:space-between; gap:10px; align-items:flex-start}
.names h3{margin:0; font-size:15.5px; font-weight:700; line-height:1.25}
.names .sym{font-family:var(--mono); font-size:11px; color:var(--faint); letter-spacing:.05em}
.price-block{text-align:right; flex:0 0 auto}
.price{display:block; font-size:16px; font-weight:700}
.day{font-size:12px}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--muted)}
canvas.spark{display:block; width:100%; height:54px; margin:9px 0 7px}
.chips{display:flex; gap:6px; flex-wrap:wrap; font-size:11.5px}
.chips span{border:1px solid var(--line); border-radius:6px; padding:2px 7px; color:var(--muted); background:var(--panel2)}
.chips b{font-weight:600}
.badges{display:flex; gap:6px; flex-wrap:wrap; margin-top:9px}
.badge{font-size:11px; padding:3px 9px; border-radius:999px; border:1px solid var(--line); color:var(--muted); background:var(--panel2); letter-spacing:.02em}
.b-sig.s-strong{border-color:var(--up); color:var(--up)}
.b-sig.s-positive{border-color:color-mix(in srgb,var(--up) 70%, var(--warn)); color:color-mix(in srgb,var(--up) 70%, var(--warn))}
.b-sig.s-neutral{border-color:var(--faint); color:var(--muted)}
.b-sig.s-caution{border-color:var(--warn); color:var(--warn)}
.b-sig.s-weak{border-color:var(--down); color:var(--down)}
.b-risk.r-low{border-color:var(--up); color:var(--up)}
.b-risk.r-med{border-color:var(--warn); color:var(--warn)}
.b-risk.r-high{border-color:var(--orange); color:var(--orange)}
.b-risk.r-vhigh{border-color:var(--down); color:var(--down)}
.b-demo{border-color:var(--down); color:var(--down); font-family:var(--mono)}
.b-stale{border-color:var(--warn); color:var(--warn); font-family:var(--mono)}
.card-actions{display:flex; gap:8px; margin-top:11px}
.card-actions .btn{padding:7px 12px; font-size:13px}
#emptyMsg{color:var(--muted); padding:30px 10px; text-align:center}

/* ============ Detail overlay ============ */
#detail{position:fixed; inset:0; z-index:50; background:color-mix(in srgb, var(--bg) 88%, black); overflow-y:auto; -webkit-overflow-scrolling:touch}
.detail-in{max-width:860px; margin:0 auto; padding:16px 14px 60px}
.detail-card{background:var(--panel); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow); padding:18px 16px}
.d-head{display:flex; align-items:flex-start; gap:10px}
.d-head h2{margin:0; font-size:19px; line-height:1.25}
#dSub{font-family:var(--mono); font-size:11.5px; color:var(--faint); letter-spacing:.05em}
.d-price-row{display:flex; align-items:baseline; gap:12px; margin:12px 0 4px}
#dPrice{font-size:26px; font-weight:800}
#dDay{font-size:14px}
#dBadges{margin:8px 0 14px}
#dChartWrap{position:relative}
canvas#dChart{display:block; width:100%; height:280px}
@media(max-width:560px){ canvas#dChart{height:230px} }
.legend{display:flex; flex-wrap:wrap; gap:12px; margin:8px 0 2px; font-size:11.5px; color:var(--muted)}
.legend i{display:inline-block; width:14px; height:3px; border-radius:2px; margin-right:5px; vertical-align:middle}
.proj-row{display:flex; align-items:center; gap:8px; margin:10px 0 2px; font-size:13.5px; color:var(--muted); flex-wrap:wrap}
#dProjText{font-size:12.5px; color:var(--faint); margin:4px 0 0}
.d-sec{margin-top:20px}
.d-sec h3{font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--faint); font-family:var(--mono); margin:0 0 9px; border-bottom:1px solid var(--line); padding-bottom:6px}
.metrics{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px}
.metric{background:var(--panel2); border:1px solid var(--line); border-radius:var(--r-s); padding:9px 11px}
.metric .k{font-size:10.5px; color:var(--faint); letter-spacing:.08em; text-transform:uppercase; font-family:var(--mono)}
.metric .v{font-size:15px; font-weight:700; margin-top:3px}
.why{margin:0; padding-left:20px}
.why li{margin:5px 0; font-size:13.5px}
.why .pts{font-family:var(--mono); color:var(--faint); font-size:12px}
.d-actions{display:flex; gap:9px; flex-wrap:wrap; margin-top:20px}
#dStamp{color:var(--faint); font-size:11.5px; font-family:var(--mono); margin-top:14px}

/* ============ Learn ============ */
#learnContent details{background:var(--panel); border:1px solid var(--line); border-radius:var(--r); margin-bottom:10px; overflow:hidden}
#learnContent summary{cursor:pointer; padding:14px 16px; font-weight:700; font-size:15px; list-style:none; display:flex; align-items:center; gap:10px}
#learnContent summary::-webkit-details-marker{display:none}
#learnContent summary::before{content:"▸"; color:var(--accent); transition:transform .15s}
#learnContent details[open] summary::before{transform:rotate(90deg)}
#learnContent .sec-body{padding:0 16px 15px; color:var(--muted); font-size:14px}
#learnContent .sec-body p{margin:8px 0}
#learnContent .sec-body strong{color:var(--ink)}
#learnContent table{border-collapse:collapse; width:100%; margin:8px 0; font-size:13px}
#learnContent th,#learnContent td{border:1px solid var(--line); padding:6px 9px; text-align:left}
#learnContent th{color:var(--faint); font-family:var(--mono); font-size:11px; letter-spacing:.06em; text-transform:uppercase}
#learnContent ul{margin:6px 0; padding-left:20px}
#learnContent li{margin:4px 0}
.warnbox{border:1px solid var(--warn); background:color-mix(in srgb, var(--warn) 9%, transparent); border-radius:var(--r-s); padding:10px 13px; color:var(--warn); font-size:13.5px}

/* ============ Settings ============ */
.set-group{background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:15px 16px; margin-bottom:12px}
.set-group h3{margin:0 0 12px; font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--faint); font-family:var(--mono); border-bottom:1px solid var(--line); padding-bottom:7px}
.set-row{display:flex; align-items:center; gap:10px; margin:10px 0; flex-wrap:wrap}
.set-row label{flex:0 0 auto; min-width:150px; font-size:13.5px; color:var(--muted)}
.set-row select,.set-row input[type=text],.set-row input[type=number],.set-row input[type=password]{flex:1; min-width:150px}
.wl-item{display:flex; align-items:center; gap:9px; padding:8px 0; border-bottom:1px dashed var(--line); font-size:13.5px}
.wl-item:last-child{border-bottom:none}
.wl-item .mono{color:var(--faint); font-size:11.5px}
.wl-item .grow{flex:1; min-width:0}
.wl-item button{flex:0 0 auto}
#searchResults .res{display:flex; align-items:center; gap:9px; padding:8px 10px; border:1px solid var(--line); border-radius:var(--r-s); margin:6px 0; font-size:13.5px; background:var(--panel2)}
#searchResults .res .grow{flex:1; min-width:0}
textarea#backupArea{width:100%; min-height:110px; font-family:var(--mono); font-size:12px}
.hint{font-size:12px; color:var(--faint); margin:6px 0 0}

.hd-view{max-width:74px}
.hd-sel{border:1px solid var(--line); background:var(--panel2); color:var(--ink); border-radius:var(--r-s);
  padding:7px 3px; font-size:12px; font-family:var(--mono); cursor:pointer; max-width:58px}
.funnel{display:flex; flex-wrap:wrap; align-items:center; gap:5px; margin:0 0 14px; font-size:11px; font-family:var(--mono)}
.fn-step{border:1px solid var(--line); background:var(--panel2); border-radius:7px; padding:4px 8px; color:var(--muted)}
.fn-step b{color:var(--ink); margin-left:5px}
.fn-step i{color:var(--down); font-style:normal; margin-left:5px}
.fn-step u{color:var(--warn); text-decoration:none; margin-left:5px; cursor:help}
.fn-step.fn-zero{border-color:var(--down); color:var(--down)}
.fn-arrow{color:var(--faint)}

/* ============ Screener ============ */
.sc-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(168px,1fr)); gap:9px; margin-bottom:12px}
.sc-grid label{display:flex; flex-direction:column; gap:4px; font-size:11px; letter-spacing:.06em;
  text-transform:uppercase; color:var(--faint); font-family:var(--mono)}
.sc-grid input{width:100%; font-size:13.5px; text-transform:none; letter-spacing:0; font-family:var(--sans)}
.sc-grid select{width:100%; font-size:13.5px; text-transform:none; letter-spacing:0; font-family:var(--sans)}
#scMeta{font-family:var(--mono); font-size:11px; color:var(--faint); margin:0 0 12px}
#scList .mv-id .chips span{font-size:10.5px; padding:1px 5px}

.sc-grid label{position:relative}
.sc-help{display:block; margin-top:4px; font-size:10.5px; line-height:1.4; color:var(--faint);
  text-transform:none; letter-spacing:0; font-family:var(--sans)}
#btnScHelp{font-weight:700; width:38px; padding:0}
#btnScHelp.on{border-color:var(--accent); color:var(--accent)}

.zoom-bar{display:flex; align-items:center; gap:9px; flex-wrap:wrap; margin:6px 0 0; min-height:26px}
#dZoomInfo{font-size:11px; color:var(--warn)}
.zoom-tip{font-size:11px; color:var(--faint)}
canvas#dChart{touch-action:pan-y; cursor:grab}

/* ============ Time travel ============ */
.travel{margin:10px 0 2px}
.travel-btns{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px}
.travel-btns .chip{padding:5px 11px; font-size:12.5px}
#dTravel{width:100%; accent-color:var(--warn); margin:2px 0}
#dTravelOut{font-size:13px; color:var(--muted); margin:6px 0 0; min-height:19px}
.chip-sep{width:1px; height:22px; background:var(--line); margin:0 3px}
.badge.b-fresh{border-color:var(--up); color:var(--up); font-family:var(--mono)}

.ok-dot,.warn-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:middle}
.ok-dot{background:var(--up)} .warn-dot{background:var(--warn)}

/* ============ Guest ============ */
#userChip{flex:0 0 auto; max-width:84px; overflow:hidden; text-overflow:ellipsis; font-family:var(--mono); font-size:11px; color:var(--accent); border:1px solid var(--accent); border-radius:999px; padding:3px 9px; white-space:nowrap}
#guestChip{font-family:var(--mono); font-size:11px; color:var(--warn); border:1px solid var(--warn); border-radius:999px; padding:3px 9px; white-space:nowrap}
#lockGuest, #lockReset{border-top:1px solid var(--line); margin-top:18px; padding-top:14px}
#depOut{width:100%; font-family:var(--mono); font-size:10.5px; border:1px solid var(--line);
  background:var(--panel2); color:var(--ink); border-radius:var(--r-s); padding:9px; margin-top:6px}
#lockReset{border-top:none; margin-top:0}
#lockReset input{width:100%; padding:11px 12px; border-radius:var(--r-s); border:1px solid var(--line); background:var(--panel2); color:var(--ink); font-size:16px}
#deployWarn{border:1px solid var(--warn); background:color-mix(in srgb, var(--warn) 10%, transparent);
  color:var(--warn); border-radius:var(--r-s); padding:9px 12px; font-size:12.5px; margin:0 0 14px; line-height:1.45}
#lockGuest input{width:100%; padding:11px 12px; border-radius:var(--r-s); border:1px solid var(--line); background:var(--panel2); color:var(--ink); font-size:16px; font-family:var(--mono); letter-spacing:.08em; text-transform:uppercase}
#gOut{flex:1; font-family:var(--mono); letter-spacing:.06em}
textarea#deployArea{width:100%; min-height:74px; font-family:var(--mono); font-size:11.5px}
.warn-inline{color:var(--warn)}
.mv-warn{flex:0 0 auto; color:var(--warn); font-size:13px; cursor:help}

/* ============ Movers ============ */
.mv-bar{display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-bottom:12px}
.mv-bar .spacer{flex:1}
#mvProgress{height:3px; background:var(--grid); border-radius:2px; overflow:hidden; margin-bottom:12px}
#mvProgress i{display:block; height:100%; width:0; background:var(--accent); transition:width .25s}
#mvMeta{font-family:var(--mono); font-size:11px; color:var(--faint); margin:0 0 12px}
.mv-league{margin-bottom:22px}
.mv-h{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; margin:0 0 10px; padding-bottom:7px;
  border-bottom:1px solid var(--line); font-size:12px; letter-spacing:.12em; text-transform:uppercase;
  color:var(--accent); font-family:var(--mono)}
.mv-h span{margin-left:auto; color:var(--faint); letter-spacing:.04em; text-transform:none; font-size:11px}
.mv-row{display:flex; align-items:center; gap:11px; cursor:pointer; padding:11px 12px; border:1px solid var(--line); background:var(--panel);
  border-radius:var(--r); margin-bottom:8px; box-shadow:var(--shadow)}
.mv-rank{flex:0 0 24px; font-family:var(--mono); font-size:13px; color:var(--faint); text-align:right}
.mv-id{flex:1; min-width:0}
.mv-id b{display:block; font-size:14.5px; line-height:1.25; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.mv-id span{font-family:var(--mono); font-size:10.5px; color:var(--faint)}
canvas.mv-spark{flex:0 0 58px; width:58px; height:26px}
.mv-num{flex:0 0 auto; text-align:right; font-family:var(--mono)}
.mv-num b{display:block; font-size:15px}
.mv-num span{font-size:11px; color:var(--faint)}
.mv-act{flex:0 0 auto; display:flex; gap:6px}
.mv-act button, .mv-act a{border:1px solid var(--line); background:var(--panel2); color:var(--ink); border-radius:8px;
  min-width:34px; height:34px; padding:0 6px; display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:11.5px; font-family:var(--mono); text-decoration:none}
.mv-act button{font-size:15px; font-family:inherit}
.mv-act button:hover, .mv-act a:hover{border-color:var(--accent)}
.mv-act button.in{color:var(--up); border-color:var(--up); cursor:default}
.mv-act button:disabled{opacity:.5}
@media(max-width:480px){ canvas.mv-spark{display:none} .mv-rank{flex-basis:18px} }

/* per-card refresh + stamp */
.btn.spin, .mv-act button.spin{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){ .btn.spin,.mv-act button.spin{animation:none} }
.card-stamp{font-family:var(--mono); font-size:10px; color:var(--faint); margin:9px 0 0; letter-spacing:.03em}
.card-actions .act-one{margin-left:auto; width:34px; padding:0; display:flex; align-items:center; justify-content:center}
.sortgrp{display:flex; align-items:center; gap:8px; margin-left:auto}

/* ============ Planner ============ */
#tabbar{overflow-x:auto; scrollbar-width:none}
#tabbar::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto}
.plan-intro{color:var(--muted); font-size:13.5px; margin:0 0 14px; max-width:70ch}
.cur-suffix{color:var(--faint); font-family:var(--mono); font-size:13px}
.plan-warn{margin:0 0 12px; padding:10px 14px; border-radius:var(--r-s); font-size:13.5px; border:1px solid var(--down); color:var(--down); background:color-mix(in srgb, var(--down) 10%, transparent)}
.plan-empty{color:var(--muted); border:1px dashed var(--line); border-radius:var(--r); padding:22px 16px; text-align:center; font-size:14px}
.pf-head{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; margin-bottom:4px}
.pf-head .big{font-size:24px; font-weight:800}
.tbl{width:100%; border-collapse:collapse; font-size:13.5px; margin-top:4px}
.tbl th{font-family:var(--mono); font-size:10.5px; letter-spacing:.09em; text-transform:uppercase; color:var(--faint); text-align:left; padding:7px 8px; border-bottom:1px solid var(--line); white-space:nowrap}
.tbl td{padding:9px 8px; border-bottom:1px solid var(--grid); vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl td.num, .tbl th.num{text-align:right; font-family:var(--mono); font-variant-numeric:tabular-nums; white-space:nowrap}
.tbl .aname{font-weight:600} .tbl .asub{font-family:var(--mono); font-size:10.5px; color:var(--faint)}
.wbar{position:relative; height:5px; border-radius:3px; background:var(--grid); margin-top:5px; overflow:hidden}
.wbar i{position:absolute; inset:0 auto 0 0; background:var(--accent); border-radius:3px}
.wbar i.sat{background:var(--warn)}
.tbl tr.core-row .aname::before{content:"KERN"; font-family:var(--mono); font-size:9px; letter-spacing:.1em; color:var(--accent); display:block}
html[lang="en"] .tbl tr.core-row .aname::before{content:"CORE"}
.tbl tr.sat-row .aname::before{content:"SATELLIT"; font-family:var(--mono); font-size:9px; letter-spacing:.1em; color:var(--warn); display:block}
html[lang="en"] .tbl tr.sat-row .aname::before{content:"SATELLITE"}
.tbl .trlink{color:var(--accent); text-decoration:none; font-size:12px; white-space:nowrap}
canvas#planChart{display:block; width:100%; height:250px; margin-top:6px}
@media(max-width:560px){ canvas#planChart{height:210px}
  .tbl th,.tbl td{padding:7px 5px; font-size:12.5px} .tbl .hide-s{display:none} }
.out-row-hi td{color:var(--ink)}
.excl{font-size:12.5px; color:var(--faint); margin:8px 0 0; line-height:1.7}
.excl b{color:var(--muted); font-weight:600}
.amt-line{font-size:12.5px; color:var(--muted); background:var(--panel2); border:1px solid var(--line); border-radius:var(--r-s); padding:8px 11px; margin:2px 0 12px}
.autoline{font-size:11.5px; color:var(--faint); margin:8px 0 0; line-height:1.5}

/* ============ Data status ============ */
#statusBox{margin:0 0 12px; border:1px solid var(--warn); border-radius:var(--r-s); background:color-mix(in srgb, var(--warn) 7%, transparent); padding:10px 12px}
#statusBox h4{margin:0 0 7px; font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--warn); font-family:var(--mono)}
.st-row{display:flex; align-items:center; gap:9px; font-size:12.5px; padding:4px 0; border-top:1px dashed var(--line)}
.st-row:first-of-type{border-top:none}
.st-row .grow{flex:1; min-width:0}
.st-row .tag{font-family:var(--mono); font-size:10.5px; padding:1px 6px; border-radius:5px; border:1px solid currentColor}
.st-row .tag.demo{color:var(--down)} .st-row .tag.stale{color:var(--warn)}
.st-row time{color:var(--faint); font-family:var(--mono); font-size:11px}
.st-row button{padding:4px 9px; font-size:12px}

/* ============ Plan ============ */
.plan-card{background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:15px 16px; margin-bottom:12px; box-shadow:var(--shadow)}
.plan-card h3{margin:0 0 11px; font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--faint); font-family:var(--mono); border-bottom:1px solid var(--line); padding-bottom:7px}
.mixbar{display:flex; height:11px; border-radius:6px; overflow:hidden; margin:4px 0 14px; border:1px solid var(--line)}
.mixbar i{display:block; height:100%}
table.tbl{width:100%; border-collapse:collapse; font-size:13px}
table.tbl th{font-family:var(--mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--faint); text-align:right; padding:6px 7px; border-bottom:1px solid var(--line); font-weight:600}
table.tbl th:first-child, table.tbl td:first-child{text-align:left}
table.tbl td{padding:8px 7px; border-bottom:1px solid var(--grid); text-align:right; vertical-align:top}
table.tbl tr:last-child td{border-bottom:none}
table.tbl .nm{font-weight:600} table.tbl .sb{display:block; font-family:var(--mono); font-size:10.5px; color:var(--faint)}
table.tbl .rsn{display:block; font-size:11.5px; color:var(--muted); margin-top:3px; max-width:330px}
.kpis{display:grid; grid-template-columns:repeat(auto-fill,minmax(128px,1fr)); gap:8px; margin:12px 0 4px}
.kpi{background:var(--panel2); border:1px solid var(--line); border-radius:var(--r-s); padding:8px 10px}
.kpi .k{font-size:10px; color:var(--faint); letter-spacing:.07em; text-transform:uppercase; font-family:var(--mono)}
.kpi .v{font-size:15px; font-weight:700; margin-top:2px}
.scen-lo{color:var(--down)} .scen-hi{color:var(--up)} .scen-mid{font-weight:700}
.plan-note{font-size:12.5px; color:var(--muted); margin:12px 0 0; line-height:1.5}
.plan-miss{border:1px solid var(--accent); border-radius:var(--r-s); padding:10px 12px; margin-bottom:12px; font-size:13px; color:var(--muted)}
.plan-miss button{margin-top:8px}
@media(max-width:560px){ table.tbl{font-size:12px} table.tbl th,table.tbl td{padding:6px 4px} table.tbl .rsn{max-width:none} }

/* ============ Universe ============ */
.uni-row{display:flex; align-items:center; gap:10px; padding:9px 11px; border:1px solid var(--line); border-radius:var(--r-s); background:var(--panel); margin:6px 0}
.uni-row .grow{flex:1; min-width:0}
.uni-row b{font-size:13.5px} .uni-row .meta{display:block; font-family:var(--mono); font-size:10.5px; color:var(--faint); margin-top:2px}
.uni-row .ter{font-family:var(--mono); font-size:12.5px; text-align:right; min-width:56px}
.ter-cheap{color:var(--up); font-weight:700}
.uni-row button{flex:0 0 auto; padding:6px 11px; font-size:12.5px}
.uni-head{font-family:var(--mono); font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--faint); margin:16px 0 4px; border-bottom:1px solid var(--line); padding-bottom:5px}
.uni-count{color:var(--faint); font-size:12.5px; margin:2px 0 8px}
#tabbar{overflow-x:auto; scrollbar-width:none}
#tabbar::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto}

/* ============ Phone layout ============ */
html[data-view="mobile"] #cardGrid{grid-template-columns:1fr}
html[data-view="mobile"] .hd-in{padding:8px 10px; gap:6px}
html[data-view="mobile"] .brand small, html[data-view="mobile"] #lastUpdate{display:none}
html[data-view="mobile"] .brand h1{font-size:13px; letter-spacing:.06em}
html[data-view="mobile"] .hd-in{flex-wrap:wrap; row-gap:6px}
html[data-view="mobile"] .brand{flex:1 1 100%; margin-right:0}
html[data-view="mobile"] #userChip{max-width:110px}
html[data-view="mobile"] .hd-sel{max-width:none; padding:7px 6px}
html[data-view="mobile"] .strip{flex-direction:column; align-items:stretch; gap:4px}
html[data-view="mobile"] .strip-title{min-width:0}
html[data-view="mobile"] .btn.icon{padding:9px 11px}
html[data-view="mobile"] main{padding:12px 10px 90px}
html[data-view="mobile"] .tab{padding:9px 15px; font-size:14px}
html[data-view="mobile"] .btn{padding:11px 15px}          /* thumb-sized targets */
html[data-view="mobile"] .chip{padding:9px 14px; font-size:13.5px}
html[data-view="mobile"] .mv-act button, html[data-view="mobile"] .mv-act a{min-width:40px; height:40px}
html[data-view="mobile"] canvas.mv-spark{display:none}
html[data-view="mobile"] .mv-rank{flex-basis:18px}
html[data-view="mobile"] .sc-grid{grid-template-columns:1fr 1fr; gap:7px}
html[data-view="mobile"] .set-row{flex-direction:column; align-items:stretch; gap:6px}
html[data-view="mobile"] .set-row label{min-width:0}
html[data-view="mobile"] .metrics{grid-template-columns:1fr 1fr}
html[data-view="mobile"] canvas#dChart{height:220px}
html[data-view="mobile"] canvas#planChart{height:200px}
html[data-view="mobile"] .tbl th, html[data-view="mobile"] .tbl td{padding:6px 4px; font-size:12px}
html[data-view="mobile"] .tbl .hide-s{display:none}
html[data-view="mobile"] .detail-in{padding:12px 10px 70px}
html[data-view="mobile"] .d-actions .btn{flex:1 1 45%}
/* forced desktop on a small screen: let it scroll rather than squash */
html[data-view="desktop"] body{min-width:1040px}

/* ============ Footer ============ */
footer{max-width:1080px; margin:10px auto 0; padding:0 14px 30px; color:var(--faint); font-size:12px; text-align:center}
</style>
</head>
<body>

<!-- ================= LOCK ================= -->
<div id="lockScreen">
  <div class="lock-card">
    <div class="lock-brand"><span class="dot"></span><h1>DEPOT·RADAR</h1></div>
    <p class="lock-hint" id="lockHint"></p>
    <p id="deployWarn" class="hidden"></p>

    <div id="lockSetup" class="hidden">
      <label for="suPw" data-i18n="pw"></label>
      <span class="pw-wrap"><input type="password" id="suPw" autocomplete="new-password"><button type="button" class="pw-eye" data-eye="suPw" title="">&#128065;</button></span>
      <label for="suPw2" data-i18n="pw2"></label>
      <span class="pw-wrap"><input type="password" id="suPw2" autocomplete="new-password"><button type="button" class="pw-eye" data-eye="suPw2" title="">&#128065;</button></span>
      <label class="lock-keep"><input type="checkbox" id="suKeep" checked> <span data-i18n="keep"></span></label>
      <p class="lock-err" id="suErr"></p>
      <div class="lock-actions">
        <button class="btn primary" id="btnSetup" data-i18n="create"></button>
      </div>
    </div>

    <div id="lockLogin" class="hidden">
      <label for="liUser" data-i18n="a_ident"></label>
      <input type="text" id="liUser" autocomplete="username" spellcheck="false" placeholder="admin">
      <label for="liPw" data-i18n="pw"></label>
      <span class="pw-wrap"><input type="password" id="liPw" autocomplete="current-password"><button type="button" class="pw-eye" data-eye="liPw" title="">&#128065;</button></span>
      <label class="lock-keep"><input type="checkbox" id="liKeep"> <span data-i18n="keep"></span></label>
      <p class="lock-err" id="liErr"></p>
      <div class="lock-actions">
        <button class="btn primary" id="btnLogin" data-i18n="unlock"></button>
        <button class="lock-forgot" id="btnHaveInvite" data-i18n="a_have_invite"></button>
        <button class="lock-forgot" id="btnForgot" data-i18n="forgot"></button>
      </div>
    </div>

    <div id="lockNew" class="hidden">
      <label for="nwCode" data-i18n="a_invite"></label>
      <input type="text" id="nwCode" autocomplete="off" spellcheck="false" placeholder="KXXXX-XXXXXXX-XXXXXX">
      <label for="nwUser" data-i18n="a_user"></label>
      <input type="text" id="nwUser" autocomplete="username" spellcheck="false">
      <label for="nwMail" data-i18n="a_email"></label>
      <input type="text" id="nwMail" autocomplete="email" spellcheck="false" inputmode="email">
      <label for="nwPw" data-i18n="pw"></label>
      <span class="pw-wrap"><input type="password" id="nwPw" autocomplete="new-password"><button type="button" class="pw-eye" data-eye="nwPw" title="">&#128065;</button></span>
      <label for="nwPw2" data-i18n="pw2"></label>
      <span class="pw-wrap"><input type="password" id="nwPw2" autocomplete="new-password"><button type="button" class="pw-eye" data-eye="nwPw2" title="">&#128065;</button></span>
      <p class="lock-err" id="nwErr"></p>
      <div class="lock-actions">
        <button class="btn primary" id="btnCreateAcct" data-i18n="a_create"></button>
        <button class="lock-forgot" id="btnBackLogin" data-i18n="a_back"></button>
      </div>
    </div>

    <div id="lockReset" class="hidden">
      <label for="rsUser" data-i18n="a_ident"></label>
      <input type="text" id="rsUser" spellcheck="false">
      <label for="rsCode" data-i18n="r_code"></label>
      <input type="text" id="rsCode" spellcheck="false" placeholder="RXXXXXXX-XXXXXX">
      <label for="rsPw" data-i18n="pw_new"></label>
      <span class="pw-wrap"><input type="password" id="rsPw" autocomplete="new-password"><button type="button" class="pw-eye" data-eye="rsPw" title="">&#128065;</button></span>
      <label for="rsPw2" data-i18n="pw_new2"></label>
      <span class="pw-wrap"><input type="password" id="rsPw2" autocomplete="new-password"><button type="button" class="pw-eye" data-eye="rsPw2" title="">&#128065;</button></span>
      <p class="lock-err" id="rsErr"></p>
      <div class="lock-actions">
        <button class="btn primary" id="btnSendMailReset" data-i18n="fa_send_mail"></button>
        <button class="btn" id="btnDoReset" data-i18n="r_apply"></button>
        <a class="btn ghost" id="mailAdmin" href="#" data-i18n="r_mail"></a>
        <button class="lock-forgot" id="btnBackLogin2" data-i18n="a_back"></button>
      </div>
    </div>

    <div id="lockDeploy" class="hidden">
      <p class="lock-hint" data-i18n="dep_intro"></p>
      <textarea id="depOut" readonly rows="3"></textarea>
      <div class="lock-actions">
        <button class="btn primary" id="btnDepDl" data-i18n="dl_btn"></button>
        <button class="btn" id="btnDepCopy" data-i18n="dep_copy"></button>
        <button class="lock-forgot" id="btnDepSkip" data-i18n="dep_later"></button>
      </div>
      <p class="hint" data-i18n="dep_steps"></p>
    </div>

    <div id="lockGuest" class="hidden">
      <label for="gCode" data-i18n="g_code"></label>
      <input type="text" id="gCode" autocomplete="off" spellcheck="false" placeholder="XXXXXXXX-XXXXXX">
      <p class="lock-err" id="gErr"></p>
      <div class="lock-actions"><button class="btn" id="btnGuest" data-i18n="g_enter"></button></div>
    </div>
  </div>
</div>

<!-- ================= APP ================= -->
<div id="app" class="hidden">
  <header id="appHeader">
    <div class="hd-in">
      <div class="brand">
        <span class="dot" id="statusDot"></span>
        <h1>DEPOT·RADAR</h1>
        <small data-i18n="tagline"></small>
      </div>
      <span id="userChip" class="hidden"></span>
      <span id="guestChip" class="hidden"></span>
      <span id="lastUpdate"></span>
      <button class="btn icon ghost" id="btnRefresh" title="Refresh">⟳</button>
      <select id="hdView" class="hd-sel hd-view" title="Ansicht / layout">
        <option value="auto" data-i18n="v_auto_s"></option>
        <option value="desktop" data-i18n="v_desktop"></option>
        <option value="mobile" data-i18n="v_mobile"></option>
      </select>
      <select id="hdCur" class="hd-sel" title="Währung / currency">
        <option value="auto">⇄</option><option value="EUR">€</option>
        <option value="USD">$</option><option value="GBP">£</option><option value="CHF">CHF</option>
      </select>
      <button class="btn icon ghost" id="btnLang">EN</button>
      <button class="btn icon ghost" id="btnTheme">☀</button>
      <button class="btn icon ghost" id="btnLock" title="Lock">🔒</button>
    </div>
    <nav id="tabbar">
    <button class="tab on" data-tab="overview" data-i18n="tab_overview"></button>
    <button class="tab" data-tab="movers" data-i18n="tab_movers"></button>
    <button class="tab" data-tab="screen" data-i18n="tab_screen"></button>
    <button class="tab" data-tab="plan" data-i18n="tab_plan"></button>
    <button class="tab" data-tab="universe" data-i18n="tab_universe"></button>
    <button class="tab" data-tab="learn" data-i18n="tab_learn"></button>
    <button class="tab" data-tab="settings" data-i18n="tab_settings"></button>
    </nav>
  </header>

  <main>
    <div id="banner" class="hidden"></div>

    <!-- ---------- OVERVIEW ---------- -->
    <section class="panel on" id="panel-overview">
      <div id="statusBox" class="hidden"></div>
      <div class="strips">
        <div class="strip"><span class="strip-title" data-i18n="strip_trend"></span><span id="stripTrend"></span></div>
        <div class="strip"><span class="strip-title" data-i18n="strip_steady"></span><span id="stripSteady"></span></div>
        <div class="strip"><span class="strip-title" data-i18n="strip_caution"></span><span id="stripCaution"></span></div>
      </div>

      <div class="controls">
        <button class="chip on" data-filter="all" data-i18n="f_all"></button>
        <button class="chip" data-filter="etf" data-i18n="f_etf"></button>

/* ---------------- SHA-256 (crypto.subtle + pure-JS fallback for file://) ---------------- */
function sha256Sync(ascii){
  function rr(v,a){ return (v>>>a)|(v<<(32-a)); }
  const maxWord = Math.pow(2,32); let result='';
  const words=[], asciiBitLength = ascii.length*8;
  let hash = sha256Sync.h = sha256Sync.h || [];
  const k = sha256Sync.k = sha256Sync.k || [];
  let primeCounter = k.length; const isComposite = {};
  for(let candidate=2; primeCounter<64; candidate++){
    if(!isComposite[candidate]){
      for(let i=0;i<313;i+=candidate) isComposite[i]=candidate;
      hash[primeCounter] = (Math.pow(candidate,.5)*maxWord)|0;
      k[primeCounter++] = (Math.pow(candidate,1/3)*maxWord)|0;
    }
  }
  ascii += '\x80';
  while(ascii.length%64 - 56) ascii += '\x00';
  for(let i=0;i<ascii.length;i++){
    const j = ascii.charCodeAt(i); if(j>>8) return '';
    words[i>>2] |= j << ((3-i)%4)*8;
  }
  words[words.length] = (asciiBitLength/maxWord)|0;
  words[words.length] = asciiBitLength;
  for(let j=0;j<words.length;){
    const w = words.slice(j, j+=16); const oldHash = hash; hash = hash.slice(0,8);
    for(let i=0;i<64;i++){
      const w15=w[i-15], w2=w[i-2], a=hash[0], e=hash[4];
      const temp1 = hash[7]
        + (rr(e,6)^rr(e,11)^rr(e,25))
        + ((e&hash[5])^((~e)&hash[6]))
        + k[i]
        + (w[i] = (i<16) ? w[i] : ( w[i-16] + (rr(w15,7)^rr(w15,18)^(w15>>>3)) + w[i-7] + (rr(w2,17)^rr(w2,19)^(w2>>>10)) )|0 );
      const temp2 = (rr(a,2)^rr(a,13)^rr(a,22)) + ((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
      hash = [(temp1+temp2)|0].concat(hash);
      hash[4] = (hash[4]+temp1)|0;
    }
    for(let i=0;i<8;i++) hash[i] = (hash[i]+oldHash[i])|0;
  }
  for(let i=0;i<8;i++) for(let j=3;j+1;j--){
    const b = (hash[i]>>(j*8))&255; result += (b<16?'0':'') + b.toString(16);
  }
  return result;
}
async function sha256(str){
  try{
    if(window.crypto && crypto.subtle){
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
      return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
    }
  }catch(e){}
  return sha256Sync(unescape(encodeURIComponent(str)));
}
function randomSalt(){
  const a = new Uint8Array(16);
  (window.crypto && crypto.getRandomValues) ? crypto.getRandomValues(a) : a.forEach((_,i)=>a[i]=Math.floor(Math.random()*256));
  return Array.from(a).map(b=>b.toString(16).padStart(2,'0')).join('');
}

  g_list_hint:'Every code you create appears here with its remaining time and note. "Revoke" adds it to a public revocation list checked at redemption, so a single code can be withdrawn without invalidating the rest. Whether a code has been used still cannot be seen: verification runs without a server and leaves no trace.',

  sc_h_rsi:'RSI = Relative Strength Index, a 0 to 100 figure from the last 14 days of price moves. Above 70 counts as overbought (heavily bought, pullback more likely), below 30 as oversold. A 40 to 70 band catches assets that are rising but not yet overheated.',
  sc_h_minp:'Minimum price per share in its trading currency. Filters out very cheap paper, which often swings hard.',

  v_is_mobile:'active: phone', v_is_desktop:'active: PC',
  s_view_hint:'Automatic follows window width and input type: below 760 pixels, or on a touch device, it uses the phone layout, otherwise the PC one. You can switch by hand at any time and the choice travels with your account. "PC" on a phone shows the wide layout scaled down, like "request desktop site" in the browser. On iPhone and Android you can also add the page to your home screen from the share menu, and it then starts without an address bar, like an app.',

  s_trmode:'TR button does', s_trmode_copy:'copy the ISIN only', s_trmode_open:'copy the ISIN and open TR',
  s_trmode_hint:'Trade Republic has no address for a single security. The ?layout=… address is a saved workspace, and it always shows whichever instrument you last selected in it - Apple, in your case. Whatever you click, the same page appears. So the TR button copies the ISIN by default instead of opening a wrong page. Pasted into TR\'s search it takes two seconds to reach the right security. If you want the page opened anyway, switch to "copy the ISIN and open TR" above.',
  s_fxmin:'Refresh exchange rates every (minutes)',
  fx_age:'· as of {t}',
  s_fx_hint:'Rates are not built into the file, they are fetched live and cached locally. The app checks every minute whether the stored set is older than your interval and only then fetches again. One expectation to set: the ECB publishes its reference rates once per working day in the afternoon, so polling more often usually returns the same number. It still helps, because a failed fetch then heals within minutes instead of staying stuck until you reload.',
  s_tr_layout:'Tip for the TR link: the ?layout=… address is a saved workspace in Trade Republic, and it remembers the last instrument you selected there, usually Apple. There is no way to target a security through it, TR simply cannot do this. You can paste your own layout address into the "Trade Republic link" field above, and the TR button will open your trading window directly instead of redirecting. The ISIN is already on the clipboard when you click, so it only needs pasting into the search.',
  s_src_yf:'Yahoo Finance',
  s_src_hint:'TradingView and Yahoo Finance open the right page directly, no login. Trade Republic is a banking app: every page requires a login and single securities have no public address. The TR link therefore lands on the dashboard. Clicking copies the ISIN so you can paste it into TR\'s search after signing in.',

const INFO = {
de: `
<details open><summary>Was ist eine Aktie?</summary><div class="sec-body">
<p>Eine <strong>Aktie</strong> ist ein Anteil an einem Unternehmen. Wer eine Aktie kauft, wird Miteigentümer – mit Anspruch auf einen Teil des Gewinns (Dividende) und auf Wertsteigerung, wenn das Unternehmen wächst.</p>
<p>Der Kurs entsteht an der Börse aus Angebot und Nachfrage. Er reagiert auf Geschäftszahlen, Zinsen, Nachrichten und Stimmung – deshalb schwanken einzelne Aktien oft stark. <strong>Einzelaktien tragen Klumpenrisiko:</strong> Geht es dem einen Unternehmen schlecht, trifft es dein ganzes Investment in diesem Wert.</p>
</div></details>
<details open><summary>Was ist ein ETF?</summary><div class="sec-body">
<p>Ein <strong>ETF</strong> (Exchange Traded Fund) ist ein börsengehandelter Fonds, der einen ganzen Index nachbildet – z. B. den MSCI World mit rund 1.400 Unternehmen weltweit. Mit einem Kauf bist du also breit gestreut.</p>
<p>Diese <strong>Diversifikation</strong> senkt das Risiko einzelner Firmenpleiten deutlich, schützt aber nicht vor allgemeinen Marktrückgängen. Wichtige Begriffe: <strong>TER</strong> (laufende Kosten pro Jahr, oft 0,1–0,5 %), <strong>UCITS</strong> (EU-reguliert), <strong>Acc/Thesaurierend</strong> (Erträge werden reinvestiert) vs. <strong>Dist/Ausschüttend</strong>.</p>
</div></details>
<details><summary>Wie entstehen die Signale?</summary><div class="sec-body">
<p>Das Signal ist eine <strong>transparente Punktesumme</strong> aus klassischen technischen Kennzahlen – nichts Geheimes, alles nachrechenbar:</p>
<table><tr><th>Baustein</th><th>Bedeutung</th><th>Punkte</th></tr>
<tr><td>Kurs vs. 200-Tage-Linie (SMA 200)</td><td>Langfristtrend intakt / gebrochen</td><td>+2 / −2</td></tr>
<tr><td>SMA 50 vs. SMA 200</td><td>„Golden Cross“-Lage / „Death Cross“-Lage</td><td>+1 / −1</td></tr>
<tr><td>6-Monats-Momentum</td><td>Mittelfristige Richtung</td><td>+1 / −1</td></tr>
<tr><td>Trendgüte (R² der Regression, 120 Tage)</td><td>Gleichmäßiges Wachstum vs. gleichmäßiger Abstieg</td><td>+1 / −1</td></tr>
<tr><td>RSI 14</td><td>Überkauft (&gt;72) / überverkauft (&lt;28)</td><td>−1 bzw. ±1 je nach Trend</td></tr></table>
<p>Summe ≥ 4 → <strong>Stark</strong>, 2–3 → Positiv, −1…1 → Neutral, −3…−2 → Vorsicht, ≤ −4 → Schwach. „Kauf-“ und „Verkaufssignal“ meinen hier immer: <em>rein technisch, aus Vergangenheitsdaten</em>. Solche Signale funktionieren in Trendphasen ordentlich und versagen gern an Wendepunkten – sie sind ein Startpunkt für eigene Recherche, kein Befehl.</p>
</div></details>
<details><summary>Wie wird das Risiko eingestuft?</summary><div class="sec-body">
<p>Basis ist die <strong>annualisierte Volatilität</strong> (Schwankungsbreite der Tagesrenditen der letzten ~90 Handelstage, hochgerechnet aufs Jahr):</p>
<table><tr><th>Volatilität p.a.</th><th>Stufe</th></tr>
<tr><td>unter 12 %</td><td>Niedrig</td></tr><tr><td>12–20 %</td><td>Mittel</td></tr>
<tr><td>20–32 %</td><td>Hoch</td></tr><tr><td>über 32 %</td><td>Sehr hoch</td></tr></table>
<ul><li><strong>Einzelaktien</strong> starten mindestens bei „Mittel“ (Klumpenrisiko, das die Volatilität allein nicht zeigt).</li>
<li>Ein <strong>Maximalverlust</strong> von über 40 % binnen 12 Monaten hebt die Stufe um eins an.</li></ul>
<p>Wichtig: Volatilität misst die <em>Vergangenheit</em>. Ein bisher ruhiger Wert kann morgen heftig ausschlagen – die Stufe ist eine Orientierung, keine Garantie.</p>
</div></details>
<details><summary>Die 12-Monats-Projektion – was sie kann (und was nicht)</summary><div class="sec-body">
<p>Die Projektion verlängert den <strong>log-linearen Trend der letzten ~250 Handelstage</strong> ein Jahr in die Zukunft. Das schattierte Band ist ±1 Standardabweichung aus der bisherigen Schwankung – je breiter, desto unsicherer.</p>
<p class="warnbox">Das ist bewusst <strong>naiv</strong>: Sie nimmt an, dass sich der bisherige Trend einfach fortsetzt. Zinsentscheide, Gewinnwarnungen, Kriege oder Crashs kennt sie nicht. Behandle sie als „Was wäre, wenn alles so weiterläuft?“ – niemals als Vorhersage.</p>
</div></details>
<details><summary>Verbindung zu Trade Republic</summary><div class="sec-body">
<p>Trade Republic hat <strong>keine öffentliche API</strong>. Die App verlinkt deshalb per <strong>ISIN</strong> direkt auf die Wertpapierseite in der TR-Web-App (Login nötig): <code>app.traderepublic.com/instrument/&lt;ISIN&gt;</code>. Ändert TR das Linkformat, kannst du die Vorlage in den Einstellungen anpassen; zusätzlich gibt es überall „ISIN kopieren“ für die Suche in der TR-App.</p>
<p>Die Kurse hier stammen von Xetra (via Yahoo) und können minimal von TRs Handelsplatz LS Exchange abweichen – v. a. abends und am Wochenende.</p>
</div></details>
<details><summary>Datenquelle & Grenzen</summary><div class="sec-body">
<p>Kursdaten liefert die freie Yahoo-Finance-Chart-API. Da diese Seite rein statisch gehostet wird (GitHub Pages / Firebase Hosting), läuft die Abfrage über einen öffentlichen <strong>CORS-Proxy</strong>. Solche Proxys sind Gratis-Dienste und fallen gelegentlich aus – dann in den Einstellungen umschalten oder einen eigenen eintragen.</p>
<p>Ist gar keine Quelle erreichbar, zeigt die App klar markierte <strong>DEMO</strong>-Daten (zufällig erzeugt), damit die Oberfläche bedienbar bleibt. Zuletzt geladene echte Daten werden lokal zwischengespeichert („ALT“-Markierung).</p>
</div></details>
<details><summary>Passwort & Sicherheit</summary><div class="sec-body">
<p>Der Passwortschutz (SHA-256-Hash, nur lokal im Browser gespeichert) hält neugierige Mitleser fern, wenn du den Link teilst. Er ist aber <strong>keine echte Zugriffskontrolle</strong>: Bei einer statischen Seite ist der Quelltext öffentlich einsehbar. Lege hier also niemals Geheimnisse ab.</p>
<p>Zurücksetzen: „Passwort vergessen?“ auf dem Sperrbildschirm löscht alle lokalen Daten dieses Geräts (Watchlist inklusive – vorher exportieren!). Ändern geht jederzeit in den Einstellungen. Alle Daten bleiben ausschließlich in deinem Browser.</p>
</div></details>
<details><summary>Die Top-Listen: warum ETFs und Aktien getrennt laufen</summary><div class="sec-body">
<p>Im Tab <strong>Top</strong> wird der gesamte Katalog plus deine Watchlist frisch abgefragt und nach echter Kursbewegung sortiert. Es gibt dabei <strong>zwei getrennte Ranglisten</strong>, und das ist keine Kosmetik: ein breiter ETF schwankt typischerweise um 1–2 % am Tag, eine Einzelaktie um 5–8 %. In einer gemeinsamen Liste würden die Aktien praktisch alle Plätze belegen, und ein starker ETF-Tag wäre nie zu sehen.</p>
<p>Jede Liga zeigt zusätzlich, wie viele Werte bewertet wurden und den <strong>Median</strong> der Bewegung. Das ist der wichtigere Wert: steht der Median bei +0,1 %, ist der Erste nur ein Ausreißer an einem ruhigen Tag. Steht er bei +2 %, läuft der ganze Markt.</p>
<p>Fehlgeschlagene Abfragen werden <strong>übersprungen, nicht geschätzt</strong>. Eine erfundene Zahl in einer Gewinnerliste wäre schlimmer als eine fehlende Zeile. Die Kopfzeile sagt deshalb immer, wie viele der Werte tatsächlich geladen wurden. Ein zweiter Tipp auf ⟳ bricht eine laufende Abfrage ab und behält den Zwischenstand.</p>
</div></details>
<details><summary>Der Plan-Tab: wie die Kombination zustande kommt</summary><div class="sec-body">
<p>Aus deinem Betrag, dem optionalen Sparplan und dem Risikoprofil baut die App eine <strong>Kern-Satellit-Struktur</strong>: breite ETFs als Basis, Einzelwerte mit dem stärksten Signal als Beimischung. Das Profil setzt die Obergrenzen (maximale Risikostufe, Anzahl Positionen, Anteil je Position).</p>
<p>Zwei Dinge passieren dabei, die man leicht übersieht. Erstens: <strong>austauschbare Indexfonds werden nach Kosten gefiltert</strong>. Zwei MSCI-World-ETFs enthalten fast dieselben Firmen, beide zu halten bringt keine Streuung, nur die höhere Gebühr. Es bleibt der günstigste Tracker je Kategorie, die Zwillinge stehen bei den aussortierten Werten mit Begründung. Zweitens: die <strong>laufenden Fondskosten (TER) werden von der erwarteten Rendite abgezogen</strong> – jedes Jahr, unabhängig davon, was der Markt macht. Kosten sind der einzige Teil der Rechnung, der garantiert eintritt.</p>
<p>Die Szenarien kommen aus <strong>2.000 simulierten Kursverläufen</strong> in Monatsschritten. Wichtig ist die Behandlung der Zeit: der aktuelle Trend wird <em>nicht</em> zehn Jahre verlängert, sondern verblasst mit rund zwei Jahren Halbwertszeit in eine langfristige Marktannahme (ETF 7 %, Einzelaktie 6 % p.a.). Ohne diese Dämpfung würde ein heute steiler Wert nach zehn Jahren Fantasiezahlen liefern.</p>
<p>Die Spalte <strong>Eingezahlt</strong> steht absichtlich direkt neben den Ergebnissen: nur so ist zu sehen, ob überhaupt ein Gewinn übrig bleibt. Der Pfad „Schwach" (10 %) ist genauso realistisch wie „Gut" (90 %).</p>
</div></details>
<details><summary>Gastzugang: Codes mit Ablaufdatum</summary><div class="sec-body">
<p>In den Einstellungen lässt sich ein <strong>Gast-Code</strong> für 20 Minuten bis 24 Stunden erzeugen, etwa <code>MS720Y27-D050B5</code>. Der erste Teil ist die Ablaufzeit, der zweite eine Prüfsumme aus deinem Passwort. Dadurch kann jedes Gerät den Code <strong>offline prüfen</strong> – es braucht keinen Server und es wird nichts gespeichert.</p>
<p>Gäste sehen alles außer den Einstellungen, haben einen sichtbaren Countdown und werden beim Ablauf automatisch ausgesperrt. Ein Passwortwechsel erneuert den Schlüssel und macht alle ausgegebenen Codes ungültig.</p>
<p class="warnbox">Zwei Grenzen offen gesagt: Der Code ist <strong>zeitlich begrenzt, nicht einmalig</strong> – wer ihn hat, kann ihn bis zum Ablauf mehrfach nutzen und weitergeben. Echte Einmal-Nutzung bräuchte einen Server, der sich merkt, was verbraucht ist. Und damit Codes auf fremden Geräten überhaupt greifen, muss der Deploy-Schlüssel aus den Einstellungen in der Datei stehen. Ohne ihn kann jeder, der den Link öffnet, sich einfach ein eigenes Passwort setzen. Kurze Zeitfenster sind deshalb besser als lange.</p>
</div></details>
<details><summary>Datenqualität: was geprüft wird und was nicht</summary><div class="sec-body">
<p>Jede ISIN im Katalog wird gegen ihre <strong>Prüfziffer nach ISO 6166</strong> getestet, dasselbe gilt für ISINs, die du selbst eingibst. Das erkennt Zahlendreher zuverlässig – bei der Erstellung dieser Liste hat der Test tatsächlich drei falsche ISINs gefunden, die sonst auf das falsche Wertpapier verlinkt hätten.</p>
<p>Zusätzlich vergleicht die App bei jeder Abfrage den <strong>von Yahoo gemeldeten Namen</strong> mit dem Katalognamen. Weicht er ab, erscheint ein ⚠ in der Zeile mit dem gemeldeten Namen. Das fängt falsche Ticker-Symbole ab. Unter Einstellungen prüft „Katalog prüfen" alles auf einmal.</p>
<p class="warnbox">Was beides <strong>nicht</strong> erkennt: eine gültige ISIN, die zum falschen Unternehmen gehört. Prüfziffer und Namensabgleich wären beide zufrieden. Vor einem echten Kauf also bitte in Trade Republic gegenprüfen, ob dort dasselbe Wertpapier steht.</p>
</div></details>
<details><summary>Fehlt ein Wert?</summary><div class="sec-body">
<p>Der Katalog deckt viel ab, aber nie alles. Im Tab <strong>Suchen</strong> lässt sich jeder Wert hinzufügen: Name, Ticker-Symbol oder – am zuverlässigsten – die <strong>ISIN direkt aus Trade Republic kopiert</strong>. Über das Sammelfeld gehen auch viele Zeilen auf einmal, etwa dein komplettes TR-Depot.</p>
<p>Alles, was in deiner Watchlist landet, wird bei der nächsten Abfrage <strong>automatisch mitbewertet</strong> und erscheint in den Top-Listen und im Plan. Der eingebaute Katalog ist nur der Startpunkt, nicht die Grenze.</p>
</div></details>
<details><summary>Der Filter-Tab: eigene Kriterien</summary><div class="sec-body">
<p>Elf Regler filtern den abgefragten Katalog nach messbaren Bedingungen: Kurs über SMA20/EMA20/SMA50/SMA200, Tagesänderung, Monatsentwicklung, RSI-Band, Mindestkurs, Tagesumsatz, Marktkapitalisierung und „fängt an zu steigen". Vier Voreinstellungen setzen alles auf einmal.</p>
<p>Die Regel <strong>„fängt an zu steigen"</strong> ist bewusst eng: Kurs über der 20-Tage-Linie, diese über der 50-Tage-Linie, aber erst <strong>2 bis 25 Handelstage</strong> darüber, RSI zwischen 45 und 72. Wer seit Monaten läuft, fällt raus, denn diese Bewegung ist schon eingepreist.</p>
<p>Über der Trefferliste steht ein <strong>Trichter</strong>: er zeigt für jeden Regler, wie viele Werte übrig blieben. Bleibt am Ende nichts übrig, siehst du sofort, welcher Regler zu streng war. Ein <span style="color:var(--warn)">?12</span> bedeutet: für zwölf Werte fehlt diese Messgröße. Solche Werte werden <strong>nicht</strong> aussortiert, denn eine fehlende Messung ist kein Ausschlussgrund. Yahoo liefert für Xetra oft keine Umsätze, und genau das hatte den Filter anfangs komplett leergeräumt.</p>
</div></details>
<details><summary>Konten, Anmeldung und Synchronisierung</summary><div class="sec-body">
<p>Ohne Firebase liegen Konten nur im jeweiligen Browser. Mit Firebase gibt es echte Anmeldungen: Registrierung nur per Einladungscode, Anmeldung mit <strong>Benutzername oder E-Mail</strong>, Passwort-Reset per echter E-Mail, und der Admin sieht alle Konten und kann sie sperren.</p>
<p>Angemeldete Nutzer nehmen ihre <strong>Watchlist und Einstellungen auf jedes Gerät mit</strong>. Gespeichert wird ein paar Sekunden nach jeder Änderung. Es gilt der zuletzt gespeicherte Stand, gleichzeitiges Bearbeiten auf zwei Geräten überschreibt sich also selbst.</p>
<p>Was bewusst nicht mitwandert: Datenbank-Adresse, API-Key, Admin-Adresse und Gast-Regel. Die gehören zur Datei, nicht zu einer Person. Die Admin-Adresse steht nur als Hashwert in der Datei und ist im Quelltext nicht lesbar.</p>
</div></details>
<details><summary>Währung, Kurse und Links</summary><div class="sec-body">
<p>Oben rechts lässt sich die Anzeigewährung umstellen. Umgerechnet wird mit EZB-Tageskursen; die App probiert mehrere Quellen, direkt und über den Proxy. Klappt keine, kannst du unter Einstellungen einen Kurs von Hand eintragen, dann rechnet die App ohne jede Abfrage weiter. Der angezeigte Betrag ist eine Umrechnung, nicht der echte Handelspreis in dieser Währung.</p>
<p>Jeder Wert hat drei Links. <strong>TradingView</strong> und <strong>Yahoo Finance</strong> öffnen ohne Anmeldung direkt die richtige Seite, deshalb ist TradingView voreingestellt. <strong>Trade Republic</strong> kann das grundsätzlich nicht: es ist eine Bank-App, jede Seite verlangt einen Login, und für einzelne Werte gibt es keine öffentliche Adresse. Der Link landet daher immer auf der Übersichtsseite. Beim Klick wird die ISIN kopiert, damit du sie nach dem Login in die TR-Suche einfügen kannst. TR ist zum Kaufen da, zum Nachschauen nimm TradingView. Bei ETFs führt „Zusammensetzung" zu justETF, wo die tatsächlichen Bestandteile stehen.</p>
</div></details>
<details><summary>Wichtiger Hinweis</summary><div class="sec-body">
<p class="warnbox"><strong>Keine Anlageberatung.</strong> Diese Seite zeigt technische Kennzahlen aus Vergangenheitsdaten. Vergangene Wertentwicklung ist kein verlässlicher Indikator für die Zukunft. Signale können falsch sein – besonders an Wendepunkten. Prüfe selbst (Geschäftsmodell, Kosten, Steuern, eigene Ziele) und investiere nur Geld, dessen Verlust du tragen kannst.</p>
</div></details>

<details open><summary>What is a stock (Aktie)?</summary><div class="sec-body">
<p>A <strong>stock</strong> is a share of a company. Buying one makes you a part-owner – with a claim on part of the profit (dividend) and on the upside if the company grows.</p>
<p>The price forms on the exchange from supply and demand. It reacts to earnings, interest rates, news and mood – which is why single stocks often swing hard. <strong>Single stocks carry concentration risk:</strong> if that one company struggles, your whole position in it suffers.</p>
</div></details>
<details open><summary>What is an ETF?</summary><div class="sec-body">
<p>An <strong>ETF</strong> (Exchange Traded Fund) is an exchange-traded fund that tracks a whole index – e.g. the MSCI World with roughly 1,400 companies worldwide. One purchase spreads you broadly.</p>
<p>This <strong>diversification</strong> greatly reduces single-company risk, but it does not protect against broad market declines. Useful terms: <strong>TER</strong> (yearly running cost, often 0.1–0.5%), <strong>UCITS</strong> (EU-regulated), <strong>Acc/accumulating</strong> (income reinvested) vs. <strong>Dist/distributing</strong>.</p>
</div></details>
<details><summary>How are the signals built?</summary><div class="sec-body">
<p>The signal is a <strong>transparent point score</strong> from classic technical indicators – nothing secret, everything checkable:</p>
<table><tr><th>Component</th><th>Meaning</th><th>Points</th></tr>
<tr><td>Price vs. 200-day average (SMA 200)</td><td>Long-term trend intact / broken</td><td>+2 / −2</td></tr>
<tr><td>SMA 50 vs. SMA 200</td><td>Golden-cross / death-cross state</td><td>+1 / −1</td></tr>
<tr><td>6-month momentum</td><td>Medium-term direction</td><td>+1 / −1</td></tr>
<tr><td>Trend fit (regression R², 120 days)</td><td>Steady growth vs. steady decline</td><td>+1 / −1</td></tr>
<tr><td>RSI 14</td><td>Overbought (&gt;72) / oversold (&lt;28)</td><td>−1 or ±1 depending on trend</td></tr></table>
<p>Total ≥ 4 → <strong>Strong</strong>, 2–3 → Positive, −1…1 → Neutral, −3…−2 → Caution, ≤ −4 → Weak. "Buy" and "sell" here always mean: <em>purely technical, from past data</em>. Such signals do fine in trending phases and fail happily at turning points – treat them as a starting point for your own research, never as an order.</p>
</div></details>
<details><summary>How is risk rated?</summary><div class="sec-body">
<p>The base is <strong>annualised volatility</strong> (spread of daily returns over the last ~90 trading days, scaled to a year):</p>
<table><tr><th>Volatility p.a.</th><th>Rating</th></tr>
<tr><td>below 12%</td><td>Low</td></tr><tr><td>12–20%</td><td>Medium</td></tr>
<tr><td>20–32%</td><td>High</td></tr><tr><td>above 32%</td><td>Very high</td></tr></table>
<ul><li><strong>Single stocks</strong> start at "Medium" at minimum (concentration risk that volatility alone does not show).</li>
<li>A <strong>maximum drawdown</strong> beyond 40% within 12 months lifts the rating by one step.</li></ul>
<p>Important: volatility measures the <em>past</em>. A calm asset can turn wild tomorrow – the rating is orientation, not a guarantee.</p>
</div></details>
<details><summary>The 12-month projection – what it can (and cannot) do</summary><div class="sec-body">
<p>The projection extends the <strong>log-linear trend of the last ~250 trading days</strong> one year forward. The shaded band is ±1 standard deviation from past fluctuation – the wider, the more uncertain.</p>
<p class="warnbox">This is deliberately <strong>naive</strong>: it assumes the current trend simply continues. It knows nothing about rate decisions, profit warnings, wars or crashes. Read it as "what if everything keeps going like this?" – never as a forecast.</p>
</div></details>
<details><summary>Trade Republic connection</summary><div class="sec-body">
<p>Trade Republic has <strong>no public API</strong>. The app therefore deep-links by <strong>ISIN</strong> straight to the instrument page in the TR web app (login required): <code>app.traderepublic.com/instrument/&lt;ISIN&gt;</code>. If TR changes the link format you can adjust the template in Settings; "Copy ISIN" is always available for searching inside the TR app.</p>
<p>Prices here come from Xetra (via Yahoo) and can differ slightly from TR's venue LS Exchange – especially evenings and weekends.</p>
</div></details>
<details><summary>Data source & limits</summary><div class="sec-body">
<p>Quotes come from the free Yahoo Finance chart API. Because this page is hosted statically (GitHub Pages / Firebase Hosting), requests go through a public <strong>CORS proxy</strong>. Those are free services and occasionally go down – switch proxies in Settings or set your own.</p>
<p>If no source is reachable, the app shows clearly marked <strong>DEMO</strong> data (randomly generated) so the interface stays usable. The last real data is cached locally (marked "STALE").</p>
</div></details>
<details><summary>Password & security</summary><div class="sec-body">
<p>The password gate (SHA-256 hash, stored only in your browser) keeps casual onlookers out if you share the link. It is <strong>not real access control</strong>: on a static site the source code is publicly readable. Never store secrets here.</p>
<p>Reset: "Forgot password?" on the lock screen wipes all local data on this device (watchlist included – export first!). Changing it works anytime in Settings. All data stays exclusively in your browser.</p>
</div></details>
<details><summary>The top lists: why ETFs and stocks run separately</summary><div class="sec-body">
<p>The <strong>Top</strong> tab fetches the whole catalogue plus your watchlist and ranks by actual price move. It keeps <strong>two separate leagues</strong>, and that is not cosmetic: a broad ETF typically moves 1-2% a day, a single stock 5-8%. In one combined list the stocks would take practically every slot, and a strong ETF day would never show.</p>
<p>Each league also reports how many assets were ranked and the <strong>median</strong> move. The median is the more useful number: if it sits at +0.1%, the leader is just an outlier on a quiet day. At +2%, the whole market is running.</p>
<p>Failed requests are <strong>skipped, not estimated</strong>. An invented number in a gainers list would be worse than a missing row, so the header always states how many actually loaded. Tapping ⟳ again stops a running fetch and keeps what arrived.</p>
</div></details>
<details><summary>The Plan tab: how the combination is built</summary><div class="sec-body">
<p>From your amount, the optional savings plan and the risk profile, the app builds a <strong>core-satellite structure</strong>: broad ETFs as the base, strongest-signal single names as the add-on. The profile sets the ceilings (maximum risk level, number of positions, share per position).</p>
<p>Two things happen that are easy to miss. First, <strong>interchangeable index funds are filtered by cost</strong>. Two MSCI World ETFs hold almost the same companies; owning both buys no diversification, only the higher fee. The cheapest tracker per category survives, and the twins appear among the dropped assets with a reason. Second, <strong>ongoing fund costs (TER) are deducted from the expected return</strong> - every year, whatever the market does. Costs are the only part of the calculation guaranteed to happen.</p>
<p>The scenarios come from <strong>2,000 simulated paths</strong> in monthly steps. The treatment of time matters: the current trend is <em>not</em> extended for ten years, it fades with a roughly two-year half-life into a long-run market assumption (ETF 7%, single stock 6% p.a.). Without that damping, a steep mover today would produce fantasy numbers a decade out.</p>
<p>The <strong>Paid in</strong> column sits right next to the outcomes on purpose: it is the only way to see whether any gain is left at all. The "Poor" path (10%) is exactly as realistic as "Good" (90%).</p>
</div></details>
<details><summary>Guest access: codes that expire</summary><div class="sec-body">
<p>Settings can create a <strong>guest code</strong> valid for 20 minutes up to 24 hours, e.g. <code>MS720Y27-D050B5</code>. The first part is the expiry, the second a checksum derived from your password. That lets any device verify the code <strong>offline</strong> - no server involved and nothing stored.</p>
<p>Guests see everything except Settings, get a visible countdown and are locked out automatically when it runs out. Changing your password rotates the key and invalidates every code you handed out.</p>
<p class="warnbox">Two limits stated plainly: the code is <strong>time-limited, not single-use</strong> - whoever holds it can use it repeatedly, and pass it on, until it expires. Real one-time use would need a server remembering what has been spent. And for codes to work on other people's devices at all, the deployment key from Settings must be in the file. Without it, anyone opening the link can simply set their own password. Short windows are therefore better than long ones.</p>
</div></details>
<details><summary>Data quality: what is checked and what is not</summary><div class="sec-body">
<p>Every ISIN in the catalogue is tested against its <strong>ISO 6166 check digit</strong>, and so is any ISIN you type in. That catches transposed digits reliably - while building this list the test actually found three wrong ISINs that would otherwise have deep-linked to the wrong security.</p>
<p>On top of that, each fetch compares the <strong>name Yahoo reports</strong> against the catalogue name. If they diverge, a ⚠ appears in the row with the reported name. That catches wrong ticker symbols. In Settings, "Check catalogue" runs everything at once.</p>
<p class="warnbox">What neither catches: a valid ISIN belonging to the wrong company. Check digit and name comparison would both be satisfied. So before buying anything for real, verify in Trade Republic that it is the same security.</p>
</div></details>
<details><summary>Something missing?</summary><div class="sec-body">
<p>The catalogue covers a lot but never everything. The <strong>Search</strong> tab adds any asset: by name, by ticker symbol, or - most reliably - by <strong>pasting the ISIN straight from Trade Republic</strong>. The bulk field takes many lines at once, for example your entire TR portfolio.</p>
<p>Anything that lands in your watchlist is <strong>automatically included</strong> in the next fetch and shows up in the top lists and in the planner. The built-in catalogue is the starting point, not the limit.</p>
</div></details>
<details><summary>The Filter tab: your own criteria</summary><div class="sec-body">
<p>Eleven controls filter the fetched catalogue on measurable conditions: price above SMA20/EMA20/SMA50/SMA200, daily change, monthly move, RSI band, minimum price, daily turnover, market cap and "starting to rise". Four presets set everything at once.</p>
<p>The <strong>"starting to rise"</strong> rule is deliberately narrow: price above the 20-day line, that line above the 50-day line, but only <strong>2 to 25 trading days</strong> above it, RSI between 45 and 72. Anything running for months drops out, because that move is already priced in.</p>
<p>Above the results sits a <strong>funnel</strong> showing how many assets survived each control. If nothing is left, you can see immediately which one was too strict. A <span style="color:var(--warn)">?12</span> means twelve assets have no measurement for that condition. Those are <strong>not</strong> filtered out, because a missing measurement is not a reason to reject. Yahoo often reports no turnover for Xetra, and that is exactly what emptied the screener at first.</p>
</div></details>
<details><summary>Accounts, sign-in and syncing</summary><div class="sec-body">
<p>Without Firebase, accounts live in each browser. With it there are real logins: registration only by invitation code, sign-in with <strong>username or e-mail</strong>, password reset by genuine e-mail, and the admin sees every account and can block it.</p>
<p>Signed-in users take their <strong>watchlist and settings to any device</strong>. Saving happens a few seconds after each change. The most recent save wins, so editing on two devices at once overwrites yourself.</p>
<p>Deliberately excluded from syncing: database URL, API key, admin address and the guest policy. Those belong to the file, not to a person. The admin address is stored only as a hash and cannot be read from the source.</p>
</div></details>
<details><summary>Currency, rates and links</summary><div class="sec-body">
<p>The display currency switches at the top right. Conversion uses ECB daily rates; the app tries several sources, directly and through the proxy. If none work, you can type a rate by hand in Settings and it converts with no lookup at all. The figure shown is a conversion, not the real traded price in that currency.</p>
<p>Every asset has three links. <strong>TradingView</strong> and <strong>Yahoo Finance</strong> open the right page directly without a login, which is why TradingView is the default. <strong>Trade Republic</strong> fundamentally cannot: it is a banking app, every page requires a login, and single securities have no public address. The link therefore always lands on the dashboard. Clicking copies the ISIN so you can paste it into TR's search after signing in. TR is for buying; for looking things up, use TradingView. For ETFs, "Holdings" leads to justETF, where the actual constituents are listed.</p>
