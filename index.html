    out.push((de?'Kein klar linearer Trend (R² niedrig).':'No clearly linear trend (low R²).')+pts(0));
  }
  if(a.rsi!=null){
    if(a.rsi>72) out.push((de?`RSI ${fmtNum(a.rsi,0)}: kurzfristig überkauft – Rücksetzer wahrscheinlicher.`:`RSI ${fmtNum(a.rsi,0)}: short-term overbought – pullback more likely.`)+pts(-1));
    else if(a.rsi<28) out.push(a.above200===false
      ? (de?`RSI ${fmtNum(a.rsi,0)}: überverkauft im Abwärtstrend – „fallendes Messer“.`:`RSI ${fmtNum(a.rsi,0)}: oversold in a downtrend – "falling knife".`)+pts(-1)
      : (de?`RSI ${fmtNum(a.rsi,0)}: überverkauft im intakten Trend – mögliche Rücksetzer-Chance.`:`RSI ${fmtNum(a.rsi,0)}: oversold within an intact trend – possible dip opportunity.`)+pts(1));
    else out.push((de?`RSI ${fmtNum(a.rsi,0)}: neutraler Bereich.`:`RSI ${fmtNum(a.rsi,0)}: neutral zone.`)+pts(0));
  }
  const lbl = LABELS.signal[a.signal][settings.lang];
  out.push(de?`<strong>Summe: ${a.score} Punkte → „${lbl}“.</strong> Rein technische Heuristik aus Vergangenheitsdaten – keine Garantie, besonders schwach an Wendepunkten.`
             :`<strong>Total: ${a.score} points → "${lbl}".</strong> Purely technical heuristic from past data – no guarantee, weakest at turning points.`);
  return out;
}
function explainRisk(a){
  const de = settings.lang==='de', out=[];
  if(a.vol==null){ out.push(de?'Zu wenig Historie für eine Einstufung.':'Not enough history for a rating.'); return out; }
  const tierTxt = {low:de?'Niedrig':'Low', med:de?'Mittel':'Medium', high:de?'Hoch':'High', vhigh:de?'Sehr hoch':'Very high'}[a.risk];
  out.push(de?`Annualisierte Volatilität: <strong>${fmtPct(a.vol,{signed:false})}</strong> (Skala: &lt;12 % niedrig · 12–20 % mittel · 20–32 % hoch · &gt;32 % sehr hoch).`
             :`Annualised volatility: <strong>${fmtPct(a.vol,{signed:false})}</strong> (scale: &lt;12% low · 12–20% medium · 20–32% high · &gt;32% very high).`);
  if(a.dd!=null) out.push(de?`Größter Rückgang in 12 Monaten: ${fmtPct(a.dd)}${(a.riskBumps||[]).includes('dd')?' → hebt die Stufe um eins an.':'.'}`
                            :`Largest drawdown in 12 months: ${fmtPct(a.dd)}${(a.riskBumps||[]).includes('dd')?' → lifts the rating by one step.':'.'}`);
  if((a.riskBumps||[]).includes('stock')) out.push(de?'Einzelaktie: Klumpenrisiko → Mindeststufe „Mittel“, auch bei ruhigem Kursverlauf.'
                                                     :'Single stock: concentration risk → minimum rating "Medium", even with a calm chart.');
  else if(a.type==='etf' && a.risk==='low') out.push(de?'Breit gestreuter ETF: Einzelwert-Risiken sind gedämpft, Marktrisiko bleibt.'
                                                        :'Broadly diversified ETF: single-name risk is dampened, market risk remains.');
  if(a.ter!=null) out.push(de?`Laufende Kosten: ${fmtNum(a.ter,2)} % p.a. – über 10 Jahre rund ${fmtMoney(1000*(1-Math.pow(1-a.ter/100,10)),a.cur)} je 1.000 € Anlage. ${t('ter_hint')}`
                                :`Ongoing charge: ${fmtNum(a.ter,2)}% p.a. – over 10 years roughly ${fmtMoney(1000*(1-Math.pow(1-a.ter/100,10)),a.cur)} per €1,000 invested. ${t('ter_hint')}`);
  out.push(de?`Ergebnis: <strong>${tierTxt}</strong>. Volatilität misst die Vergangenheit – die Zukunft kann davon abweichen.`
             :`Result: <strong>${tierTxt}</strong>. Volatility measures the past – the future can differ.`);
  return out;
}
function projText(a){
  const de = settings.lang==='de';
  if(!a || !a.proj) return de?'Für eine 12-Monats-Projektion reicht die Historie nicht.':'Not enough history for a 12-month projection.';
  const p=a.proj;
  return de?`Naive Fortschreibung des 250-Tage-Trends: in 12 Monaten ≈ ${fmtMoney(p.endMid,a.cur)} (±1σ-Band: ${fmtMoney(p.endLo,a.cur)} – ${fmtMoney(p.endHi,a.cur)}). Annahme „Trend läuft einfach weiter“ – keine Prognose.`
           :`Naive extension of the 250-day trend: in 12 months ≈ ${fmtMoney(p.endMid,a.cur)} (±1σ band: ${fmtMoney(p.endLo,a.cur)} – ${fmtMoney(p.endHi,a.cur)}). Assumes "trend simply continues" – not a forecast.`;
}

  const map={strong:'--up', positive:'--up', neutral:'--faint', caution:'--warn', weak:'--down'};
  return cssVar(map[a?a.signal:'neutral']||'--faint');

function drawSpark(cv, c, color){
  const dpr=window.devicePixelRatio||1, r=cv.getBoundingClientRect();
  if(r.width<10) return;
  cv.width=r.width*dpr; cv.height=r.height*dpr;
  const ctx=cv.getContext('2d'); ctx.scale(dpr,dpr);
  const W=r.width, H=r.height, data=c.slice(-130);
  if(data.length<2) return;
  let min=Infinity, max=-Infinity;
  data.forEach(v=>{ if(v<min)min=v; if(v>max)max=v; });
  const pad=2, x=i=>pad+(W-2*pad)*i/(data.length-1);
  const y=v=>H-pad-(H-2*pad)*(max===min?0.5:(v-min)/(max-min));
  ctx.beginPath(); data.forEach((v,i)=> i?ctx.lineTo(x(i),y(v)):ctx.moveTo(x(i),y(v)));
  ctx.lineWidth=1.6; ctx.strokeStyle=color;
  if(dark()){ ctx.shadowColor=color; ctx.shadowBlur=6; }
  ctx.stroke(); ctx.shadowBlur=0;
  ctx.lineTo(x(data.length-1),H); ctx.lineTo(x(0),H); ctx.closePath();
  ctx.fillStyle=hexA(color,0.10); ctx.fill();
}
function renderCards(){
  const grid=$('#cardGrid');
  let list=watchlist.filter(a=> (settings.filter==='all' || a.type===settings.filter)
    && (settings.status==='all' || ageState(analyses[a.sym])===settings.status));
  const g=(o,f,d)=> (o && o[f]!=null) ? o[f] : d;
  const cmp={
    signal:(x,y)=>{const A=analyses[x.sym],B=analyses[y.sym];return (g(B,'score',-99)-g(A,'score',-99))||(g(B,'r6m',-999)-g(A,'r6m',-999));},
    r1m:(x,y)=>g(analyses[y.sym],'r1m',-999)-g(analyses[x.sym],'r1m',-999),
    r6m:(x,y)=>g(analyses[y.sym],'r6m',-999)-g(analyses[x.sym],'r6m',-999),
    r1y:(x,y)=>g(analyses[y.sym],'r1y',-999)-g(analyses[x.sym],'r1y',-999),
    risk:(x,y)=>{const o={low:0,med:1,high:2,vhigh:3,na:4};const A=analyses[x.sym],B=analyses[y.sym];
      return (o[g(A,'risk','na')]-o[g(B,'risk','na')])||(g(A,'vol',999)-g(B,'vol',999));},
    dayPct:(x,y)=>g(analyses[y.sym],'dayPct',-999)-g(analyses[x.sym],'dayPct',-999),
    r1w:(x,y)=>g(analyses[y.sym],'r1w',-999)-g(analyses[x.sym],'r1w',-999),
    r3m:(x,y)=>g(analyses[y.sym],'r3m',-999)-g(analyses[x.sym],'r3m',-999),
    name:(x,y)=>(x.name||x.sym).localeCompare(y.name||y.sym),
    updated:(x,y)=>g(analyses[y.sym],'fetchedAt',0)-g(analyses[x.sym],'fetchedAt',0),
    oldest:(x,y)=>g(analyses[x.sym],'fetchedAt',9e15)-g(analyses[y.sym],'fetchedAt',9e15)
  }[settings.sort]||null;
  if(cmp) list=list.slice().sort(cmp);
  if(settings.sortDir === 'asc') list.reverse();
  grid.innerHTML=list.map(cardHtml).join('');
  $('#emptyMsg').classList.toggle('hidden', watchlist.length>0);
  list.forEach(asset=>{
    const s=seriesMap[asset.sym]; if(!s) return;
    const cv=grid.querySelector(`article[data-sym="${CSS.escape(asset.sym)}"] canvas.spark`);
    if(cv) drawSpark(cv, s.c, sigColor(analyses[asset.sym]));
  });
}
function stripChip(asset,val){

/* ---------------- detail overlay ---------------- */
function trUrl(isin){ return (settings.trTemplate||DEFAULT_SETTINGS.trTemplate).replace('{isin}', encodeURIComponent(isin)); }
function sourceTxt(a){ return a.demo? t('source_demo') : a.live? t('source_live') : t('source_cache'); }
/* Rows outside the watchlist carry only a 30-point sparkline, so the full
   series is fetched on demand before the detail view can render.         */
function setDetailList(syms, sym){
  detailList = (syms || []).filter(Boolean);
  detailIdx = detailList.indexOf(sym);
}
function updateDetailNav(){
  const prev = $('#dPrev'), next = $('#dNext'), pos = $('#dPos');
  if(!prev || !next) return;
  const has = detailList.length > 1 && detailIdx >= 0;
  prev.classList.toggle('hidden', !has);
  next.classList.toggle('hidden', !has);
  if(pos) pos.textContent = has ? (detailIdx + 1) + '/' + detailList.length : '';
  if(has){ prev.disabled = detailIdx <= 0; next.disabled = detailIdx >= detailList.length - 1; }
}
function detailStep(delta){
  if(detailIdx < 0 || !detailList.length) return;
  const i = detailIdx + delta;
  if(i < 0 || i >= detailList.length) return;
  detailIdx = i;
  openAnySym(detailList[i], detailList);
}
async function openAnySym(sym, listSyms){
  if(!sym) return;
  if(listSyms) setDetailList(listSyms, sym); else if(detailList.indexOf(sym) < 0) setDetailList([sym], sym);
  if(!seriesMap[sym]){
    toast(t('d_loading'));
    try{ seriesMap[sym] = await fetchSeries(sym); }
    catch(e){ toast(t('d_load_fail')); return; }
  }
  /* analyses gets wiped on language switch, import and cloud load, so it is
     rebuilt here rather than only on the fetch path                       */
  if(!analyses[sym]){
    const a = assetBySym(sym);
    analyses[sym] = analyze({sym, type:(a && a.type) || 'stock'}, seriesMap[sym]);
  }
  openDetail(sym);
}
function openDetail(sym){
  if(!seriesMap[sym]) return;
  detailSym=sym; travelIdx=null; zoomFrom=zoomTo=null; detailBlank('');
  detailIdx = detailList.indexOf(sym); updateDetailNav(); fillDetail();
  document.body.style.overflow='hidden';
  $('#detail').classList.remove('hidden');
  requestAnimationFrame(drawDetail);
}
function closeDetail(){ detailSym=null; $('#detail').classList.add('hidden'); document.body.style.overflow=''; }
function detailBlank(msg){
  ['dTitle','dSub','dPrice','dDay','dProjText','dStamp'].forEach(id=>{ const e=$('#'+id); if(e) e.textContent=''; });
  ['dBadges','dMetrics','dWhySignal','dWhyRisk','dLegend'].forEach(id=>{ const e=$('#'+id); if(e) e.innerHTML=''; });
  const t1=$('#dTitle'); if(t1) t1.textContent = msg || '';

function fillDetail(){
  const s=seriesMap[detailSym];
  let a=analyses[detailSym];
  let asset=assetBySym(detailSym);
  if(!s){ detailBlank(t('d_load_fail')); return; }
  /* an asset reached from a list may not be in the watchlist or the catalogue;
     a minimal record is better than an empty panel                          */

/* The visible window is a pair of indices. Keeping it in index space means the
   y-axis can rescale to what is on screen, which is the point of zooming.  */
const MIN_BARS = 12;
function zoomRange(){
  const s = seriesMap[detailSym];
  if(!s) return {a:0, b:0};
  const n = s.c.length;
  let a = zoomFrom == null ? 0 : Math.round(zoomFrom);
  let b = zoomTo == null ? n-1 : Math.round(zoomTo);
  a = clamp(a, 0, n-1); b = clamp(b, 0, n-1);
  if(b - a < MIN_BARS){ b = Math.min(n-1, a + MIN_BARS); a = Math.max(0, b - MIN_BARS); }
  return {a, b};
}
function zoomIsFull(){
  const s = seriesMap[detailSym]; if(!s) return true;
  const {a,b} = zoomRange();
  return a === 0 && b === s.c.length-1;
}
function zoomReset(){ zoomFrom = zoomTo = null; updateZoomLabel(); drawDetail(); }
function updateZoomLabel(){
  const btn = $('#dZoomReset'); if(!btn) return;
  btn.classList.toggle('hidden', zoomIsFull());
  const s = seriesMap[detailSym]; if(!s) return;
  const {a,b} = zoomRange();
  const d1 = new Date(s.t[a]).toLocaleDateString(locale(), {day:'2-digit', month:'2-digit', year:'2-digit'});
  const d2 = new Date(s.t[b]).toLocaleDateString(locale(), {day:'2-digit', month:'2-digit', year:'2-digit'});
  const lab = $('#dZoomInfo');
  if(lab) lab.textContent = zoomIsFull() ? '' : (d1 + ' – ' + d2 + ' · ' + (b-a+1) + ' ' + t('z_bars'));
}
/* anchor is the fraction of the window under the cursor, so the point you
   point at stays put while everything else expands around it              */
function zoomBy(factor, anchor){
  const s = seriesMap[detailSym]; if(!s) return;
  const n = s.c.length, {a,b} = zoomRange();
  const span = b - a;
  const pivot = a + span * clamp(anchor, 0, 1);
  let newSpan = clamp(span * factor, MIN_BARS, n-1);
  let na = pivot - newSpan * clamp(anchor, 0, 1);
  let nb = na + newSpan;
  if(na < 0){ nb -= na; na = 0; }
  if(nb > n-1){ na -= (nb - (n-1)); nb = n-1; }
  zoomFrom = Math.max(0, na); zoomTo = Math.min(n-1, nb);
  if(zoomIsFull()) zoomFrom = zoomTo = null;
  updateZoomLabel(); drawDetail();
}
function zoomPan(barDelta){
  const s = seriesMap[detailSym]; if(!s) return;
  const n = s.c.length, {a,b} = zoomRange(), span = b - a;
  let na = a + barDelta, nb = b + barDelta;
  if(na < 0){ na = 0; nb = span; }
  if(nb > n-1){ nb = n-1; na = nb - span; }
  zoomFrom = na; zoomTo = nb;
  updateZoomLabel(); drawDetail();
}
function travelPos(){
  const s = seriesMap[detailSym];
  if(!s) return 0;
  const last = s.c.length - 1;
  return travelIdx == null ? last : clamp(travelIdx, 0, last);
}
function updateTravelText(){
  const s = seriesMap[detailSym], a = analyses[detailSym];
  if(!s || !a) return;
  const i = travelPos(), last = s.c.length - 1;
  const price = s.c[i], now = s.c[last];
  const d = new Date(s.t[i]).toLocaleDateString(locale(), {day:'2-digit', month:'2-digit', year:'numeric'});
  if(i === last){
    $('#dTravelOut').textContent = t('tt_now_txt').replace('{d}', d).replace('{p}', fmtMoney(price, a.cur));
  } else {
    const chg = (now/price - 1) * 100;
    $('#dTravelOut').innerHTML = t('tt_read').replace('{d}', d)
      .replace('{p}', escHtml(fmtMoney(price, a.cur)))
      .replace('{c}', `<b class="${triCls(chg)}">${fmtPct(chg)}</b>`);
  }
}
function setTravel(idx){
  const s = seriesMap[detailSym]; if(!s) return;
  const last = s.c.length - 1;
  travelIdx = clamp(idx, 0, last);
  $('#dTravel').value = String(travelIdx);
  ensureTravelVisible();
  updateTravelText(); drawDetail();
}
/* the slider still spans the whole history; if its marker leaves the zoomed
   window the window follows it, so the handle never points at nothing     */
function ensureTravelVisible(){
  if(zoomFrom == null || travelIdx == null) return;
  const {a,b} = zoomRange();
  if(travelIdx < a) zoomPan(travelIdx - a);
  else if(travelIdx > b) zoomPan(travelIdx - b);
}
function drawDetail(){
  if(!detailSym) return;
  const cv=$('#dChart'), s=seriesMap[detailSym], a=analyses[detailSym];
  if(!cv||!s) return;
  const dpr=window.devicePixelRatio||1, r=cv.getBoundingClientRect();
  if(r.width<10) return;
  cv.width=r.width*dpr; cv.height=r.height*dpr;
  const ctx=cv.getContext('2d'); ctx.scale(dpr,dpr);
  const W=r.width, H=r.height; ctx.clearRect(0,0,W,H);
  const c=s.c, tm=s.t, n=c.length;
  const {a:vA, b:vB} = zoomRange();
  const atEnd = vB >= n-1;
  const showProj=$('#dProjToggle').checked && a && a.proj && atEnd;
  const projPts=showProj? a.proj.pts : [];
  const s50=smaSeries(c,50), s200=smaSeries(c,200);
  /* units are measured from the left edge of the window, so zooming simply
     shrinks the range being mapped across the same pixels                 */
  const spanUnits=(vB-vA)+(showProj?252:0);
  const padL=46,padR=8,padT=8,padB=20;
  const X=u=>padL+(W-padL-padR)*((u-vA)/(spanUnits||1));
  let lo=Infinity, hi=-Infinity;
  for(let i=vA;i<=vB;i++){ const v=c[i]; if(v<lo)lo=v; if(v>hi)hi=v; }
  [s50,s200].forEach(arr=>{ for(let i=vA;i<=vB;i++){ const v=arr[i];
    if(v!=null){ if(v<lo)lo=v; if(v>hi)hi=v; } } });
  projPts.forEach(p=>{ if(p.lo<lo)lo=p.lo; if(p.hi>hi)hi=p.hi; });
  const span=(hi-lo)||1; lo-=span*0.04; hi+=span*0.04;
  const Y=v=>padT+(H-padT-padB)*(1-(v-lo)/(hi-lo));
  const mono='11px ui-monospace, monospace';
  ctx.font=mono; ctx.fillStyle=cssVar('--faint');
  for(let i=0;i<=4;i++){
    const v=lo+(hi-lo)*i/4, y=Y(v);
    ctx.strokeStyle=cssVar('--grid'); ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(W-padR,y); ctx.stroke();
    ctx.fillText(v>=1000?fmtNum(v/1000,1)+'k':fmtNum(v,v>=100?0:2), 4, y+4);
  }
  const monthsDe=['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
  const monthsEn=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const months=settings.lang==='de'?monthsDe:monthsEn;
  let lastM=-1;
  const vis=vB-vA+1;
  const every = vis>500 ? 6 : vis>200 ? 3 : vis>60 ? 1 : 1;
  for(let i=vA;i<=vB;i++){
    const d=new Date(tm[i]), m=d.getMonth();
    if(m!==lastM){ lastM=m;
      if(m%every===0){ const x=X(i);
        ctx.strokeStyle=cssVar('--grid'); ctx.beginPath(); ctx.moveTo(x,padT); ctx.lineTo(x,H-padB); ctx.stroke();
        ctx.fillText(months[m]+' '+String(d.getFullYear()).slice(2), x-16, H-6); } }
  }
  if(showProj){
    const x=X(n-1);
    ctx.strokeStyle=cssVar('--faint'); ctx.setLineDash([3,3]);
    ctx.beginPath(); ctx.moveTo(x,padT); ctx.lineTo(x,H-padB); ctx.stroke(); ctx.setLineDash([]);
    ctx.beginPath();
    projPts.forEach((p,i)=>{ const px=X(n-1+p.d), py=Y(p.hi); i?ctx.lineTo(px,py):ctx.moveTo(px,py); });
    for(let i=projPts.length-1;i>=0;i--) ctx.lineTo(X(n-1+projPts[i].d), Y(projPts[i].lo));
    ctx.closePath(); ctx.fillStyle=hexA(cssVar('--accent'),0.13); ctx.fill();
    ctx.setLineDash([5,4]); ctx.strokeStyle=cssVar('--accent2'); ctx.lineWidth=1.4;
    ctx.beginPath();
    projPts.forEach((p,i)=>{ const px=X(n-1+p.d), py=Y(p.mid); i?ctx.lineTo(px,py):ctx.moveTo(px,py); });
    ctx.stroke(); ctx.setLineDash([]);
  }
  const line=(arr,color)=>{
    ctx.strokeStyle=color; ctx.lineWidth=1.3; ctx.setLineDash([4,3]);
    ctx.beginPath(); let st=false;
    for(let i=vA;i<=vB;i++){ const v=arr[i]; if(v==null) continue;
      const px=X(i), py=Y(v); st?ctx.lineTo(px,py):(ctx.moveTo(px,py),st=true); }
    ctx.stroke(); ctx.setLineDash([]);
  };
  line(s50, cssVar('--sma50')); line(s200, cssVar('--sma200'));
  ctx.strokeStyle=cssVar('--accent'); ctx.lineWidth=2;
  if(dark()){ ctx.shadowColor=cssVar('--accent'); ctx.shadowBlur=7; }
  ctx.beginPath();
  for(let i=vA;i<=vB;i++){ const px=X(i), py=Y(c[i]); i===vA?ctx.moveTo(px,py):ctx.lineTo(px,py); }
  ctx.stroke(); ctx.shadowBlur=0;
  if(atEnd){
    ctx.fillStyle=cssVar('--accent');
    ctx.beginPath(); ctx.arc(X(n-1),Y(c[n-1]),3,0,7); ctx.fill();
  }
  const ti = travelPos();
  if(ti < n-1 && ti >= vA && ti <= vB){
    const px=X(ti), py=Y(c[ti]);
    ctx.strokeStyle=cssVar('--warn'); ctx.lineWidth=1.3; ctx.setLineDash([3,3]);
    ctx.beginPath(); ctx.moveTo(px,padT); ctx.lineTo(px,H-padB); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle=cssVar('--warn');
    ctx.beginPath(); ctx.arc(px,py,4,0,7); ctx.fill();
  }
}

function saveCache(){
  const slim={};
  for(const [k,v] of Object.entries(seriesMap)){
    slim[k]={t:v.t, c:v.c.map(x=>Math.round(x*10000)/10000), cur:v.cur, name:v.name,
             fetchedAt:v.fetchedAt, live:v.live, demo:v.demo};
  }
  store.set('cache', slim);
}
function setBanner(kind){
  const b=$('#banner');
  if(!kind){ b.classList.add('hidden'); return; }
  b.classList.remove('hidden');
  b.classList.toggle('err', kind==='banner_demo');
  b.textContent=t(kind);
}
async function loadOne(asset){
  try{
    const s=await fetchSeries(asset.sym);
    clearFail(asset.sym);
    if(s.name && (!asset.name || asset.name===asset.sym)) asset.name=s.name;
    seriesMap[asset.sym]=s;
    return 'live';
  }catch(e){
    const old=seriesMap[asset.sym];
    if(old && !old.demo){ old.live=false; return 'stale'; }
    markFail(asset.sym);
    if(isDead(asset.sym)){ delete seriesMap[asset.sym]; delete analyses[asset.sym]; return 'dead'; }
    seriesMap[asset.sym]=demoSeries(asset.sym); return 'demo';
  }finally{
    const s=seriesMap[asset.sym];
    if(s) analyses[asset.sym]=analyze(asset,s);
  }
}
async function refreshAll(){
  if(refreshing || !watchlist.length) return;
  refreshing=true;
  const dot=$('#statusDot'); dot.className='dot busy';
  $('#btnRefresh').disabled=true;
  let live=0, stale=0, demo=0;
  const failed=[];
  for(const asset of watchlist){
    const res=await loadOne(asset);
    if(res==='live') live++; else failed.push(asset);
    renderAll();
    await sleep(260);
  }
  for(const asset of failed){          // second pass: proxy rate limits are usually transient
    await sleep(500);
    const res=await loadOne(asset);
    if(res==='live') live++; else if(res==='stale') stale++; else demo++;
    renderAll();
  }
  saveCache(); store.set('watchlist', watchlist);
  refreshing=false; $('#btnRefresh').disabled=false;
  dot.className='dot'+(live===0 ? ' err' : (stale||demo) ? ' busy' : '');
  if(!navigator.onLine) setBanner('banner_offline');
  else if(live===0) setBanner('banner_demo');
  else if(stale||demo) setBanner('banner_partial');
  else setBanner(null);
  renderAll();
  if(planState) renderPlan();
  if(detailSym){ fillDetail(); drawDetail(); }
}
async function refreshOne(sym){
  const asset=assetBySym(sym); if(!asset) return;
  await loadOne(asset); saveCache(); renderAll();
  if(detailSym===sym){ fillDetail(); drawDetail(); }
}
function scheduleAuto(){
  if(refreshTimer) clearInterval(refreshTimer);
  const m=+settings.refreshMin||0;
  if(m>0) refreshTimer=setInterval(refreshAll, m*60000);
  if(fxTimer) clearInterval(fxTimer);
  fxTimer = setInterval(()=>fxTick(false), 60000);      // checks age each minute, fetches only when due
}

/* One resolved value drives the layout, so a manual choice and the automatic
   one go through exactly the same path and cannot disagree.                 */
function resolveView(){
  const v = settings.view || 'auto';
  if(v === 'mobile' || v === 'desktop') return v;
  const w = window.innerWidth || document.documentElement.clientWidth || 1024;
  const coarse = window.matchMedia && window.matchMedia('(pointer:coarse)').matches;
  return (w < 760 || (coarse && w < 1024)) ? 'mobile' : 'desktop';
}

  const v = resolveView();
  document.documentElement.dataset.view = v;
  const meta = document.getElementById('vpMeta');

function copySilent(txt){
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(txt); return true; }
    const ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); ta.remove(); return true;
  }catch(e){ return false; }
}
function copyText(txt){
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(()=>toast(t('copied'))); return; }
  const ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta);

/* =====================================================================
   ADD ANYTHING — resolve an ISIN, symbol or name into a tradable entry.
   No hand-kept list can cover every instrument, so the app resolves
   whatever the user pastes and scans it alongside the catalogue.
   ===================================================================== */
const ISIN_RE = /^[A-Z]{2}[A-Z0-9]{9}[0-9]$/;
function preferGerman(list){
  return list.find(r => /\.(DE|F|SG|MU|BE|DU|HM)$/i.test(r.sym)) || list[0];
}
async function resolveQuery(q){
  const raw = String(q||'').trim();
  if(!raw) return null;
  const compact = raw.toUpperCase().replace(/\s+/g,'');
  const isIsin = ISIN_RE.test(compact);
  const res = await searchSymbols(isIsin ? compact : raw);
  if(!res.length) return {none:true, isin: isIsin ? compact : ''};
  return {list:res, best:preferGerman(res), isin: isIsin ? compact : ''};
}
/* ISO 6166 check digit: catches mistyped or misremembered ISINs */
function isinValid(isin){
  const s0 = String(isin||'').trim().toUpperCase();
  if(!/^[A-Z]{2}[A-Z0-9]{9}[0-9]$/.test(s0)) return false;
  let s='';
  for(const ch of s0) s += (ch>='A'&&ch<='Z') ? (ch.charCodeAt(0)-55).toString() : ch;
  let sum=0, dbl=false;
  for(let i=s.length-1;i>=0;i--){ let d=+s[i]; if(dbl){ d*=2; if(d>9) d-=9; } sum+=d; dbl=!dbl; }
  return sum%10===0;
}
function checkCatalogue(){
  const badIsin = CATALOG.filter(c=>!isinValid(c.isin));
  const items = (scanData && scanData.items) || {};
  const scanned = CATALOG.filter(c=>items[c.sym]);
  const nameOff = scanned.filter(c=>nameLooksOff(c.name, items[c.sym].yname));
  const missing = Object.keys(items).length ? CATALOG.filter(c=>!items[c.sym]) : [];
  return {total:CATALOG.length, badIsin, nameOff, missing, scanned:scanned.length};
}
function knownIsin(sym){
  const c = CATALOG.find(x => x.sym === sym);
  return c ? c.isin : '';
}

      <span class="mono" style="color:var(--faint);font-size:11px">${escHtml(x.sym)} · ${escHtml(x.exch||'')} · ${x.type==='etf'?t('t_etf'):t('t_stock')}${isin?' · '+escHtml(isin):''}</span></div>
      <button class="btn ${inWl?'':'primary'}" data-addsym="${escHtml(x.sym)}" data-addname="${escHtml(x.name)}"
        data-addtype="${x.type}" data-addisin="${escHtml(isin)}" ${inWl?'disabled':''}>${inWl?'✓':t('s_add')}</button></div>`;
  }).join('');
}
async function doAddQuery(){

async function doBulkAdd(){
  const items = [...new Set(String($('#bulkArea').value||'').split(/[\s,;]+/).map(s=>s.trim()).filter(Boolean))];
  if(!items.length) return;

/* =====================================================================
   ACCOUNTS — invite-only, verified offline against the deployed key
   Honest boundary: accounts live in each visitor's own browser. The admin
   can refuse new ones (invite required) and invalidate every existing one
   (epoch bump + re-upload), but cannot reach into someone else's device to
   delete a single account. That needs a server.
   ===================================================================== */
let accounts = store.get('accounts', {});
let isAdmin = true;
let currentUser = '';

function invSecret(){ return DEPLOY.inv || store.get('isec','') || ''; }
function ensureInvSecret(){
  let s = store.get('isec','');
  if(!s){ s = randomSalt(); store.set('isec', s); }
  return DEPLOY.inv || s;
}
function deployEpoch(){ return Math.max(1, +DEPLOY.epoch || 0, +store.get('epoch',0) || 0); }

async function makeInvite(mins){
  const sec = invSecret(); if(!sec) return null;
  const ep = deployEpoch(), exp = (+mins > 0) ? Date.now() + mins*60000 : PERMA;
  const body = ep.toString(36).toUpperCase() + '-' + exp.toString(36).toUpperCase();
  const sig = (await sha256(sec + ':' + body)).slice(0,6).toUpperCase();
  return {code: 'K' + body + '-' + sig, exp, ep};
}
/* > 0 expiry ms | 0 invalid | -1 expired | -2 revoked by an epoch bump */
async function checkInvite(raw){
  const sec = invSecret(); if(!sec) return 0;
  let s = String(raw||'').trim().toUpperCase().replace(/\s+/g,'');
  if(s.charAt(0) !== 'K') return 0;
  const parts = s.slice(1).split('-');
  if(parts.length !== 3) return 0;
  const body = parts[0] + '-' + parts[1];
  const sig = (await sha256(sec + ':' + body)).slice(0,6).toUpperCase();
  if(sig !== parts[2]) return 0;
  const ep = parseInt(parts[0],36), exp = parseInt(parts[1],36);
  if(!isFinite(ep) || !isFinite(exp) || ep <= 0) return 0;
  if(ep < deployEpoch()) return -2;
  if(exp <= Date.now()) return -1;
  return exp;
}
async function makeReset(user, mins){
  const sec = invSecret(); if(!sec) return null;
  const u = String(user||'').trim().toLowerCase();
  if(!u || u === 'admin') return null;          // see applyReset for why admin is excluded
  const exp = Date.now() + Math.max(1,mins)*60000;
  const body = exp.toString(36).toUpperCase();
  const sig = (await sha256(sec + ':R:' + u + ':' + body)).slice(0,6).toUpperCase();
  return {code: 'R' + body + '-' + sig, exp, u};
}
/* Deliberately cannot reset the admin password. The signing secret sits in the
   public source, so an admin reset code could be forged by anyone who reads it -
   that would be a far easier way in than attacking the password hash. If the
   admin password is lost, regenerate the deployment key and re-upload.          */
async function applyReset(user, code, pw, pw2){
  const sec = invSecret(); if(!sec) return 'r_bad';
  const u = String(user||'').trim().toLowerCase();
  const key = accountKey(u);
  if(!key) return 'a_login_bad';
  const parts = String(code||'').trim().toUpperCase().replace(/\s+/g,'').split('-');
  if(parts.length !== 2 || parts[0].charAt(0) !== 'R') return 'r_bad';
  const body = parts[0].slice(1);
  const sig = (await sha256(sec + ':R:' + key + ':' + body)).slice(0,6).toUpperCase();
  if(sig !== parts[1]) return 'r_bad';
  const exp = parseInt(body, 36);
  if(!isFinite(exp)) return 'r_bad';
  if(exp <= Date.now()) return 'r_expired';
  if(String(pw||'').length < 4) return 'pw_short';
  if(pw !== pw2) return 'pw_mismatch';
  const salt = randomSalt();
  accounts[key] = Object.assign({}, accounts[key], {salt, hash: await sha256(salt + ':' + pw)});
  store.set('accounts', accounts);
  if(fbOn()){ try{ await fbSet('/dr_accounts/' + key, accounts[key]); }catch(e){} }
  return null;
}
/* accepts either the username or the registered e-mail */
function accountKey(ident){
  const s = String(ident||'').trim().toLowerCase();
  if(!s) return '';
  if(accounts[s]) return s;
  for(const k of Object.keys(accounts)){ if((accounts[k].email||'').toLowerCase() === s) return k; }
  return '';
}
async function createAccount(user, email, pw, pw2, code){
  const r = await checkInvite(code);
  if(r === -2) return 'a_revoked';
  if(r === -1) return 'a_inv_expired';
  if(!r) return 'a_inv_bad';
  const u = String(user||'').trim().toLowerCase();
  const em = String(email||'').trim().toLowerCase();
  if(!/^[a-z0-9._-]{2,20}$/.test(u)) return 'a_user_bad';
  if(u === 'admin' || accounts[u]) return 'a_user_taken';
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)) return 'a_mail_bad';
  if(accountKey(em)) return 'a_mail_taken';
  if(String(pw||'').length < 4) return 'pw_short';
  if(pw !== pw2) return 'pw_mismatch';
  const salt = randomSalt();
  accounts[u] = {salt, hash: await sha256(salt + ':' + pw), email: em, epoch: deployEpoch(), at: Date.now()};
  store.set('accounts', accounts);
  if(fbOn()){ try{ await fbSet('/dr_accounts/' + u, accounts[u]); }catch(e){ return 'a_sync_fail'; } }
  return null;
}
async function verifyLogin(user, pw){
  const u = String(user||'').trim().toLowerCase();
  if(!u || u === 'admin'){
    if(!auth) return null;
    if((await sha256(auth.salt + ':' + pw)) === auth.hash) return {user:'admin', admin:true};
    return null;
  }
  let key = accountKey(u);
  if(fbOn()){
    try{
      const hit = await fbFind(u);
      if(!hit){                                   // admin deleted it, or never existed
        if(key){ delete accounts[key]; store.set('accounts', accounts); }
        return null;
      }
      key = hit.key;
      accounts[key] = hit.rec;                    // lets a new device sign in
      store.set('accounts', accounts);
    }catch(e){ /* offline: fall back to the local copy */ }
  }
  const a = accounts[key];
  if(!a) return null;
  if((a.epoch || 0) < deployEpoch()){          // invalidated by a redeploy
    delete accounts[key]; store.set('accounts', accounts); return null;
  }
  if((await sha256(a.salt + ':' + pw)) !== a.hash) return null;
  return {user:key, admin:false};
}
function accountRows(){
  return Object.keys(accounts).sort().map(u => ({user:u, at:accounts[u].at, epoch:accounts[u].epoch}));
}

function renderGCodes(){

/* Optional shared roster. Without a URL everything stays exactly as before:
   accounts local to each browser. With one, the admin sees every account and
   can really delete them, and users can sign in from any device.            */
function fbBase(){ return String(DEPLOY.fb || settings.fbUrl || '').replace(/\/+$/,''); }
function fbOn(){ return !!fbBase(); }
async function fbGet(path){
  const b = fbBase(); if(!b) return null;
  const r = await fetch(b + path + '.json', {cache:'no-store'});
  if(!r.ok) throw new Error('http ' + r.status);

}
async function fbSet(path, data){
  const b = fbBase(); if(!b) return false;
  const r = await fetch(b + path + '.json',
    {method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(data)});

async function fbDel(path){
  const b = fbBase(); if(!b) return false;
  return (await fetch(b + path + '.json', {method:'DELETE'})).ok;
}
async function fbFind(ident){
  const all = await fbGet('/dr_accounts');
  if(!all) return null;
  const s = String(ident||'').trim().toLowerCase();
  if(all[s]) return {key:s, rec:all[s]};
  for(const k of Object.keys(all)){
    if(String(all[k].email||'').toLowerCase() === s) return {key:k, rec:all[k]};
  }
  return null;
}
async function deploySnippet(){
  if(!auth) return '';
  const gsec = ensureGuestSecret(), isec = ensureInvSecret();
  const am = String(settings.adminMail||'').trim().toLowerCase();
  const amail = am ? await sha256(am) : String(DEPLOY.amail||'');
  return "const DEPLOY = {salt:'" + auth.salt + "', hash:'" + auth.hash
    + "', gsec:'" + gsec + "', inv:'" + isec + "', epoch:" + deployEpoch()
    + ", fb:'" + (settings.fbUrl || DEPLOY.fb || '')
    + "', fbkey:'" + (settings.fbKey || DEPLOY.fbkey || '')
    + "', amail:'" + amail
    + "', cmail:'" + (settings.contactMail || DEPLOY.cmail || '') + "'};";
}
/* Fetches this very page, swaps the DEPLOY line for the real one and offers the
   result as a download - so nobody has to hand-edit a 260 kB file.            */
async function downloadConfigured(){
  if(!auth) return 'g_nosec';
  if(location.protocol === 'file:') return 'dl_local';
  try{
    const res = await fetch(location.href, {cache:'no-store'});
    if(!res.ok) throw new Error('http ' + res.status);
    let html = await res.text();
    const re = /^const DEPLOY = \{[^{}]*\};/m;   // anchored: only the real declaration, never the builder string
    if(!re.test(html)) return 'dl_nomarker';
    html = html.replace(re, await deploySnippet());
    const url = URL.createObjectURL(new Blob([html], {type:'text/html'}));
    const a = document.createElement('a');
    a.href = url; a.download = 'index.html';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 8000);
    return null;
  }catch(e){ return 'dl_fail'; }
}
function bumpEpoch(){
  const next = deployEpoch() + 1;
  store.set('epoch', next);
  for(const u of Object.keys(accounts)) if((accounts[u].epoch||0) < next) delete accounts[u];
  store.set('accounts', accounts);
  return next;
}

/* =====================================================================
   FIREBASE AUTH (REST, no SDK) — proper accounts, closed database
   Signs in against Google Identity Toolkit and talks to the Realtime
   Database with the resulting ID token, so rules can require auth.
   Enabled only when both a Web API key and a database URL are present;
   otherwise the local invite system from before stays in charge.
   ===================================================================== */
function fbKey(){ return String(DEPLOY.fbkey || settings.fbKey || '').trim(); }
function fbAuthOn(){ return !!(fbKey() && fbBase()); }
let fbSession = store.get('fbsess', null);

async function fbIdent(method, body){
  const r = await fetch('https://identitytoolkit.googleapis.com/v1/accounts:' + method
      + '?key=' + encodeURIComponent(fbKey()),
    {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
  const j = await r.json().catch(()=>({}));
  if(!r.ok){
    const code = (j.error && j.error.message) || 'UNKNOWN';
    const err = new Error(code); err.code = code; throw err;
  }
  return j;
}
function fbErrKey(code){
  const c = String(code||'');
  if(c.indexOf('EMAIL_EXISTS') === 0) return 'fa_exists';
  if(c.indexOf('EMAIL_NOT_FOUND') === 0 || c.indexOf('INVALID_PASSWORD') === 0
     || c.indexOf('INVALID_LOGIN_CREDENTIALS') === 0) return 'fa_badlogin';
  if(c.indexOf('WEAK_PASSWORD') === 0) return 'fa_weak';
  if(c.indexOf('INVALID_EMAIL') === 0) return 'a_mail_bad';
  if(c.indexOf('TOO_MANY_ATTEMPTS') === 0) return 'fa_throttled';
  if(c.indexOf('USER_DISABLED') === 0) return 'fa_disabled';
  return 'fa_generic';
}
function fbSaveSession(j){
  fbSession = {idToken:j.idToken, refreshToken:j.refreshToken, uid:j.localId,
               email:String(j.email||'').toLowerCase(), at:Date.now()};
  store.set('fbsess', fbSession);
  return fbSession;
}
/* ID tokens last an hour; refresh silently when they are close to expiring */
async function fbToken(){
  if(!fbSession) return '';
  if(Date.now() - fbSession.at < 50*60000) return fbSession.idToken;
  try{
    const r = await fetch('https://securetoken.googleapis.com/v1/token?key=' + encodeURIComponent(fbKey()),
      {method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'},
       body:'grant_type=refresh_token&refresh_token=' + encodeURIComponent(fbSession.refreshToken)});
    const j = await r.json();
    if(j.id_token){
      fbSession = Object.assign({}, fbSession,
        {idToken:j.id_token, refreshToken:j.refresh_token || fbSession.refreshToken, at:Date.now()});
      store.set('fbsess', fbSession);
    }
  }catch(e){}
  return fbSession.idToken;
}
async function fbAuthGet(path){
  const tok = await fbToken();
  const r = await fetch(fbBase() + path + '.json?auth=' + encodeURIComponent(tok), {cache:'no-store'});
  if(!r.ok) throw new Error('http ' + r.status);
  return await r.json();
}
async function fbAuthSet(path, data){
  const tok = await fbToken();
  const r = await fetch(fbBase() + path + '.json?auth=' + encodeURIComponent(tok),
    {method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(data)});
  return r.ok;
}
async function fbAuthDel(path){
  const tok = await fbToken();
  return (await fetch(fbBase() + path + '.json?auth=' + encodeURIComponent(tok), {method:'DELETE'})).ok;
}
/* The admin address is never written into the file. Only its SHA-256 goes in,
   so the source reveals nothing to read or scrape. The contact alias IS in the
   file in clear - that is the point of an alias: disposable and replaceable.  */
async function isAdminEmailAsync(mail){
  const m = String(mail||'').trim().toLowerCase();
  if(!m) return false;
  const h = String(DEPLOY.amail || '').trim();
  if(h) return (await sha256(m)) === h;
  const a = String(settings.adminMail||'').trim().toLowerCase();
  return !!a && m === a;
}
function isAdminEmail(mail){                       // sync fallback, admin's own device
  const m = String(mail||'').trim().toLowerCase();
  if(fbSession && fbSession.email === m && typeof fbSession.admin === 'boolean') return fbSession.admin;
  const a = String(settings.adminMail||'').trim().toLowerCase();
  return !!a && m === a;
}
function contactAddress(){ return String(DEPLOY.cmail || settings.contactMail || '').trim(); }
/* registration still needs a valid invite; Firebase itself cannot enforce that */
async function fbRegister(user, email, pw, pw2, code){
  const r = await checkInvite(code);
  if(r === -2) return 'a_revoked';
  if(r === -1) return 'a_inv_expired';
  if(!r) return 'a_inv_bad';
  const u = String(user||'').trim().toLowerCase();
  if(!/^[a-z0-9._-]{2,20}$/.test(u)) return 'a_user_bad';
  if(String(pw||'').length < 6) return 'fa_weak';
  if(pw !== pw2) return 'pw_mismatch';
  let j;
  try{ j = await fbSignUp(String(email||'').trim().toLowerCase(), pw); }
  catch(e){ return fbErrKey(e.code); }
  fbSaveSession(j);
  try{ await fbAuthSet('/users/' + j.localId, {name:u, email:fbSession.email, at:Date.now()}); }
  catch(e){ return 'a_sync_fail'; }
  /* the admin is left out on purpose: no lookup entry, no exposed address */
  if(settings.adminNameLogin || !(await isAdminEmailAsync(fbSession.email))){
    try{ await fbAuthSet('/usernames/' + u, fbSession.email); }catch(e){}
  }
  return null;
}
async function fbSignUp(email, pw){ return fbIdent('signUp', {email, password:pw, returnSecureToken:true}); }
async function fbSignIn(email, pw){ return fbIdent('signInWithPassword', {email, password:pw, returnSecureToken:true}); }
async function fbSendReset(email){ return fbIdent('sendOobCode', {requestType:'PASSWORD_RESET', email:String(email||'').trim().toLowerCase()}); }

/* Firebase only knows e-mail addresses. A small public map turns a username
   into one. Rules allow reading a single key but not listing the map, and the
   admin is deliberately left out of it so the admin address stays private.  */
async function fbResolveIdent(ident){
  const s = String(ident||'').trim().toLowerCase();
  if(!s) return '';
  if(s.indexOf('@') > 0) return s;
  try{
    const r = await fetch(fbBase() + '/usernames/' + encodeURIComponent(s) + '.json', {cache:'no-store'});
    if(r.ok){
      const v = await r.json();
      if(typeof v === 'string' && v.indexOf('@') > 0) return v.toLowerCase();
    }
  }catch(e){}
  return '';
}
async function fbLogin(ident, pw){
  const email = await fbResolveIdent(ident);
  if(!email) return {err:'fa_user_unknown'};
  let j;
  try{ j = await fbSignIn(email, pw); }
  catch(e){ return {err: fbErrKey(e.code)}; }
  fbSaveSession(j);
  const admin = await isAdminEmailAsync(fbSession.email);
  fbSession.admin = admin; store.set('fbsess', fbSession);
  /* The profile is the membership record. Deleting it must actually lock the
     person out - previously a missing profile was tolerated and they got in. */
  let prof = null;
  try{ prof = await fbAuthGet('/users/' + j.localId); }
  catch(e){
    if(!admin){ fbSession = null; store.del('fbsess'); return {err:'fa_no_profile'}; }
  }
  if(!prof && !admin){
    fbSession = null; store.del('fbsess');
    return {err:'fa_removed'};
  }
  const res = {user:(prof && prof.name) || fbSession.email, admin, email:fbSession.email};
  currentUser = res.user;
  sessionTouch();
  return res;
}
function fbProjectId(){
  const m = String(fbBase()||'').match(/https:\/\/([^.]+?)-default-rtdb\./);
  return m ? m[1] : '';
}
function fbUsersConsoleUrl(){
  const p = fbProjectId();
  return p ? 'https://console.firebase.google.com/project/' + p + '/authentication/users' : '';
}
/* Accounts created before the username lookup existed have no entry. The admin
   may overwrite any name, so a single pass repairs the whole roster.         */
async function syncUsernames(){
  if(!fbSession) return {ok:0, skip:0};
  let rows = [];
  try{ rows = await fbRoster(); }catch(e){ return {ok:0, skip:0, err:true}; }
  let ok = 0, skip = 0;
  for(const r of rows){
    const name = String(r.name||'').trim().toLowerCase();
    if(!name || name.indexOf('@') >= 0){ skip++; continue; }
    const isAdmin = await isAdminEmailAsync(r.email);
    if(isAdmin && !settings.adminNameLogin){ skip++; continue; }   // keep admin address unlisted
    try{ if(await fbAuthSet('/usernames/' + encodeURIComponent(name), r.email)) ok++; else skip++; }
    catch(e){ skip++; }
  }
  return {ok, skip};
}
/* What follows a person from device to device. Deployment settings (database
   URL, API key, admin address, guest policy) are deliberately NOT in this list:
   they belong to the file, not to a user, and must never be overwritten by
   whatever a friend happens to have set on their own phone.                  */
const SYNC_KEYS = ['lang','theme','dispCur','fxMin','view','scHelp','gcodes','sort','sortDir','filter','status','staleMin',
                   'planAmount','planMonthly','planProfile','screen','mvPeriod','mvDir','scanHours'];
let cloudTimer = null, cloudLoading = false;
function syncPayload(){
  const prefs = {};
  SYNC_KEYS.forEach(k => { if(settings[k] !== undefined && settings[k] !== null) prefs[k] = settings[k]; });
  return {watchlist: watchlist, prefs: prefs, at: Date.now()};
}
async function cloudSave(){
  if(!fbAuthOn() || !fbSession) return false;
  try{ return await fbAuthSet('/userdata/' + fbSession.uid, syncPayload()); }
  catch(e){ return false; }
}
function cloudSaveSoon(){
  if(cloudLoading || !fbAuthOn() || !fbSession) return;
  clearTimeout(cloudTimer);
  cloudTimer = setTimeout(cloudSave, 3000);          // debounce a burst of edits
}
async function cloudLoad(){
  if(!fbAuthOn() || !fbSession) return false;
  let d = null;
  try{ d = await fbAuthGet('/userdata/' + fbSession.uid); }catch(e){ return false; }
  if(!d) return false;
  cloudLoading = true;
  try{
    if(Array.isArray(d.watchlist)){
      const clean = d.watchlist.filter(a => a && a.sym).map(a => ({
        sym:String(a.sym), name:a.name||'', isin:(a.isin||'').toUpperCase(),
        type: a.type === 'stock' ? 'stock' : 'etf'}));
      if(clean.length){ watchlist = clean; store.set('watchlist', watchlist); }
    }
    if(d.prefs){
      SYNC_KEYS.forEach(k => { if(d.prefs[k] !== undefined) settings[k] = d.prefs[k]; });
      saveSettings();
    }
  } finally { cloudLoading = false; }
  return true;
}
/* One record per browser per account, so the admin can see real devices
   rather than guessing from account names.                              */
function deviceId(){
  let d = store.get('devid','');
  if(!d){ d = randomSalt().slice(0,12); store.set('devid', d); }
  return d;
}
function deviceName(){
  const ua = navigator.userAgent || '';
  const os = /Android/i.test(ua) ? 'Android'
    : /iPhone|iPad|iPod/i.test(ua) ? 'iOS'
    : /Windows/i.test(ua) ? 'Windows'
    : /Mac OS X/i.test(ua) ? 'macOS'
    : /Linux/i.test(ua) ? 'Linux' : '?';
  const br = /Edg\//i.test(ua) ? 'Edge'
    : /SamsungBrowser/i.test(ua) ? 'Samsung'
    : /Firefox/i.test(ua) ? 'Firefox'
    : /Chrome/i.test(ua) ? 'Chrome'
    : /Safari/i.test(ua) ? 'Safari' : '?';
  return os + ' · ' + br;
}
async function sessionTouch(){
  if(!fbAuthOn() || !fbSession) return;
  const key = fbSession.uid + '_' + deviceId();
  try{
    await fbAuthSet('/sessions/' + key, {
      uid: fbSession.uid, user: currentUser || fbSession.email, email: fbSession.email,
      device: deviceName(), dev: deviceId(), at: Date.now(), last: Date.now()});
  }catch(e){}
}
/* If the admin removed this session, the device signs itself out. */
async function sessionCheck(){
  if(!fbAuthOn() || !fbSession || isAdmin) return;
  const key = fbSession.uid + '_' + deviceId();
  try{
    const rec = await fbAuthGet('/sessions/' + key);
    if(rec === null){ fbSession = null; store.del('fbsess'); store.del('authed'); lockNow(); toast(t('se_kicked')); }
  }catch(e){}
}
async function fbSessions(){
  const all = await fbAuthGet('/sessions');
  if(!all) return [];
  return Object.keys(all).map(k => Object.assign({key:k}, all[k]))
    .sort((a,b) => (b.last||0) - (a.last||0));
}
async function fbRoster(){
  const all = await fbAuthGet('/users');
  if(!all) return [];
  return Object.keys(all).map(uid => ({uid, name:all[uid].name || '?', email:all[uid].email || '', at:all[uid].at || 0}))
    .sort((a,b) => (a.name||'').localeCompare(b.name||''));
}

/* =====================================================================
   GUEST ACCESS — self-contained, time-limited codes (no server)
   code = base36(expiry) + '-' + first 6 hex of sha256(secret + ':' + body)
   Anyone holding a valid code gets in until it expires. Verifiable offline
   because the secret is baked into the deployed file.
   ===================================================================== */
const PERMA = 4102444800000;                 // 2100-01-01, stands for "no expiry"
function isPerma(exp){ return exp >= PERMA - 1; }
function expLabel(exp){ return isPerma(exp) ? t('g_perma') : fmtTime(exp); }
function guestSecret(){
  if(settings.guestOff) return '';        // admin disabled account-free access
  return DEPLOY.gsec || store.get('gsec','') || '';
}
function ensureGuestSecret(){
  let s = store.get('gsec','');
  if(!s){ s = randomSalt(); store.set('gsec', s); }
  return DEPLOY.gsec || s;
}
/* Codes verify offline, so nothing was ever recorded and the admin had no
   way to see what was outstanding. The ledger fixes that, and a published
   revocation list makes a single code withdrawable.                      */
function gcodes(){ return Array.isArray(settings.gcodes) ? settings.gcodes : []; }
function gcodeSave(list){ settings.gcodes = list.slice(0, 60); saveSettings(); }
function gcodeAdd(code, exp, note){
  const list = gcodes().filter(g => g.code !== code);
  list.unshift({code, exp, note: note || '', at: Date.now()});
  gcodeSave(list);
}
async function gcodeRevoke(code){
  const h = (await sha256('rv:' + code)).slice(0, 20);
  if(fbAuthOn() && fbSession){
    try{ if(!(await fbAuthSet('/revoked/' + h, Date.now()))) return false; }catch(e){ return false; }
  }
  const local = store.get('revoked', {}); local[h] = Date.now(); store.set('revoked', local);
  const list = gcodes().map(g => g.code === code ? Object.assign({}, g, {rev: Date.now()}) : g);
  gcodeSave(list);
  return true;
}
async function gcodeIsRevoked(code){
  const h = (await sha256('rv:' + code)).slice(0, 20);
  if((store.get('revoked', {}) || {})[h]) return true;
  if(fbBase()){
    try{
      const r = await fetch(fbBase() + '/revoked/' + h + '.json', {cache:'no-store'});
      if(r.ok && (await r.json()) != null) return true;
    }catch(e){}
  }
  return false;
}
async function makeGuestCode(mins){
  const sec = guestSecret(); if(!sec) return null;
  const exp = (+mins > 0) ? Date.now() + mins*60000 : PERMA;
  const body = exp.toString(36).toUpperCase();
  const sig = (await sha256(sec + ':' + deployEpoch() + ':' + body)).slice(0,6).toUpperCase();
  return {code: body + '-' + sig, exp};
}
/* returns expiry ms, 0 = invalid, -1 = correct but expired */
async function checkGuestCode(raw){
  const sec = guestSecret(); if(!sec) return 0;
  const parts = String(raw||'').trim().toUpperCase().replace(/\s+/g,'').split('-');
  if(parts.length !== 2 || !parts[0] || !parts[1]) return 0;
  const exp = parseInt(parts[0], 36);
  if(!isFinite(exp) || exp <= 0) return 0;
  const sig = (await sha256(sec + ':' + deployEpoch() + ':' + parts[0])).slice(0,6).toUpperCase();
  if(sig !== parts[1]) return 0;              // also fails once the epoch is bumped
  if(await gcodeIsRevoked(parts[0] + '-' + parts[1])) return -3;   // withdrawn individually
  return exp > Date.now() ? exp : -1;
}
function tickGuest(){
  if(!guestUntil) return;
  if(isPerma(guestUntil)){ $('#guestChip').textContent = t('g_chip'); return; }
  const left = guestUntil - Date.now();
  if(left <= 0){ endGuest(t('g_expired_now')); return; }
  const m = Math.floor(left/60000), s = Math.floor((left%60000)/1000);
  $('#guestChip').textContent = t('g_chip') + ' ' + m + ':' + String(s).padStart(2,'0');
}
function endGuest(msg){
  guestUntil = 0; guestMode = false;
  store.del('guest');
  if(guestTimer){ clearInterval(guestTimer); guestTimer = null; }
  closeDetail(); showLock();
  if(msg) toast(msg);
}
function applyGuestUI(){
  const st = document.querySelector('#tabbar [data-tab="settings"]');
  if(st) st.classList.toggle('hidden', guestMode);
  $('#guestChip').classList.toggle('hidden', !guestMode);
  if(guestTimer){ clearInterval(guestTimer); guestTimer = null; }
  if(guestMode){
    if($('#panel-settings').classList.contains('on')){
      const ov = document.querySelector('#tabbar [data-tab="overview"]');
      if(ov) ov.click();
    }
    guestTimer = setInterval(tickGuest, 1000);
    tickGuest();
  }
}
async function redeemGuestCode(){
  const err = $('#gErr'), val = $('#gCode').value;
  const res = await checkGuestCode(val);
  if(res === -1){ err.textContent = t('g_expired'); return; }
  if(!res){ err.textContent = t('g_bad'); return; }
  err.textContent = '';
  $('#gCode').value = '';
  guestUntil = res;
  store.set('guest', {until: res});
  store.del('authed');
  unlock(true);
}

/* ---------------- auth ---------------- */
function showLock(){
  $('#app').classList.add('hidden');
  $('#lockScreen').classList.remove('hidden');
  const setup=!auth;
  $('#lockSetup').classList.toggle('hidden',!setup);
  $('#lockLogin').classList.toggle('hidden',setup);
  $('#lockHint').textContent=t(setup?'lock_setup_hint':'lock_login_hint');
  $('#lockGuest').classList.toggle('hidden', !guestSecret());
  $('#lockNew').classList.add('hidden');
  $('#lockReset').classList.add('hidden');
  $('#btnHaveInvite').classList.toggle('hidden', setup);
  const nag = $('#depNag'); if(nag) nag.classList.toggle('hidden', !!DEPLOY.hash);
  const dw = $('#deployWarn');
  dw.textContent = t('dep_warn');
  dw.classList.toggle('hidden', !!DEPLOY.hash);
  setTimeout(()=>{ (setup?$('#suPw'):$('#liPw')).focus(); },50);
}
async function doSetup(){
  const p=$('#suPw').value, p2=$('#suPw2').value, err=$('#suErr');
  if(p.length<4){ err.textContent=t('pw_short'); return; }
  if(p!==p2){ err.textContent=t('pw_mismatch'); return; }
  err.textContent='';
  const salt=randomSalt();
  auth={salt, hash: await sha256(salt+':'+p)};
  store.set('auth',auth);
  ensureGuestSecret(); ensureInvSecret();
  isAdmin=true; currentUser='admin';
  if(!DEPLOY.hash){                       // fresh file: show the key before anything else
    $('#lockSetup').classList.add('hidden');
    $('#lockGuest').classList.add('hidden');
    $('#deployWarn').classList.add('hidden');
    $('#lockDeploy').classList.remove('hidden');
    deploySnippet().then(v=>{ $('#depOut').value = v; });
    return;
  }
  if($('#suKeep').checked) store.set('authed',1);
  unlock();
}
async function doLogin(){
  const u=$('#liUser').value, p=$('#liPw').value, err=$('#liErr');
  if(fbAuthOn()){
    err.textContent = t('fa_wait');
    const r = await fbLogin(u, p);
    if(!r.err){
      err.textContent=''; $('#liPw').value='';
      isAdmin = r.admin; currentUser = r.user;
      if($('#liKeep').checked) store.set('authed', {u:r.user, admin:r.admin, fb:1});
      unlock(); return;
    }
    /* Firebase said no. Fall back to the built-in admin password so the owner
       can always get in - needed to issue the first invite code, and to
       recover if Firebase is misconfigured or unreachable.                  */
    const local = await verifyLogin(u, p);
    if(local && local.admin){
      err.textContent=''; $('#liPw').value='';
      isAdmin = true; currentUser = local.user;
      if($('#liKeep').checked) store.set('authed', {u:local.user, admin:true});
      unlock(); toast(t('fa_local_admin')); return;
    }
    err.textContent = t(r.err); $('#liPw').select(); return;
  }
  const res=await verifyLogin(u,p);
  if(!res){ err.textContent = (u && u.trim().toLowerCase()!=='admin') ? t('a_login_bad') : t('pw_wrong'); $('#liPw').select(); return; }
  err.textContent=''; $('#liPw').value='';
  isAdmin=res.admin; currentUser=res.user;
  if($('#liKeep').checked) store.set('authed', {u:res.user, admin:res.admin});
  unlock();
}
function unlock(isGuest){
  guestMode = !!isGuest;
  $('#lockScreen').classList.add('hidden');
  $('#app').classList.remove('hidden');
  for(const asset of watchlist){ const s=seriesMap[asset.sym]; if(s) analyses[asset.sym]=analyze(asset,s); }
  applyLang(); applyGuestUI(); applyRoleUI(); scheduleAuto();
  sessionTouch();          // devices restored from "stay signed in" never registered before
  if(fbAuthOn() && fbSession){
    cloudLoad().then(found => {
      if(found){ analyses = {}; applyLang(); renderAll(); }
      refreshAll();
    });
  } else refreshAll();
  fxTick(false);
}
function lockNow(){
  if(fbAuthOn() && fbSession){ clearTimeout(cloudTimer); cloudSave(); }
  store.del('authed'); $('#liPw').value=''; currentUser=''; isAdmin=true;
  if(guestMode){ endGuest(); return; }
  closeDetail(); showLock();
}
function resetApp(){
  const inp=prompt(t('reset_confirm'));
  if(inp && inp.trim().toUpperCase()==='RESET'){ store.clear(); location.reload(); }
}

  (function bindZoom(){
    const cv = $('#dChart'); if(!cv) return;
    const frac = clientX => {
      const r = cv.getBoundingClientRect();
      const padL = 46, padR = 8;
      return clamp((clientX - r.left - padL) / Math.max(1, r.width - padL - padR), 0, 1);
    };
    cv.addEventListener('wheel', e => {
      if(!detailSym) return;
      e.preventDefault();
      zoomBy(e.deltaY > 0 ? 1.25 : 0.8, frac(e.clientX));
    }, {passive:false});
    let drag = null;
    cv.addEventListener('pointerdown', e => {
      if(!detailSym || e.pointerType === 'touch') return;
      drag = {x:e.clientX, range:zoomRange()};
      cv.setPointerCapture(e.pointerId); cv.style.cursor = 'grabbing';
    });
    cv.addEventListener('pointermove', e => {
      if(!drag) return;
      const r = cv.getBoundingClientRect();
      const span = drag.range.b - drag.range.a;
      const bars = Math.round((drag.x - e.clientX) / Math.max(1, r.width - 54) * span);
      if(bars){ zoomFrom = drag.range.a; zoomTo = drag.range.b; zoomPan(bars); }
    });
    const endDrag = () => { drag = null; cv.style.cursor = ''; };
    cv.addEventListener('pointerup', endDrag);
    cv.addEventListener('pointercancel', endDrag);
    cv.addEventListener('dblclick', e => { e.preventDefault(); zoomReset(); });
    /* pinch: two fingers, distance ratio drives the zoom factor */
    let pinch = null;
    cv.addEventListener('touchstart', e => {
      if(e.touches.length === 2){
        const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX,
                             e.touches[0].clientY - e.touches[1].clientY);
        pinch = {d, mid:(e.touches[0].clientX + e.touches[1].clientX)/2};
      }
    }, {passive:true});
    cv.addEventListener('touchmove', e => {
      if(pinch && e.touches.length === 2){
        e.preventDefault();
        const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX,
                             e.touches[0].clientY - e.touches[1].clientY);
        if(Math.abs(d - pinch.d) > 6){
          zoomBy(pinch.d / Math.max(1, d), frac(pinch.mid));
          pinch.d = d;
        }
      }
    }, {passive:false});
    cv.addEventListener('touchend', () => { pinch = null; }, {passive:true});
  })();

/* =====================================================================
   MOVERS — independent scan of the universe, ranked by real price move
   ===================================================================== */
function SCAN_LIST(){
  const seen=new Set(CATALOG.map(c=>c.sym));
  return CATALOG.concat(watchlist.filter(w=>!seen.has(w.sym)).map(w=>({sym:w.sym,isin:w.isin||'',name:w.name||w.sym,type:w.type,cat:'watch'})));
}
let scanning = false, scanAbort = false;
let scanProg = {done:0, total:0, ok:0};
let scanData = store.get('scan', {at:0, ok:0, total:0, items:{}});

/* Same rules as the watchlist rating, computed from the scan snapshot, so the
   screener can filter on signal, trend and risk instead of the user having to
   open every asset one by one.                                              */
function scanScore(m, type){
  if(!m) return null;
  const above200 = m.sma200 != null ? m.p > m.sma200 : null;
  const golden = (m.sma50 != null && m.sma200 != null) ? m.sma50 > m.sma200 : null;
  let sc = 0;
  if(above200 === true) sc += 2; else if(above200 === false) sc -= 2;
  if(golden === true) sc += 1; else if(golden === false) sc -= 1;
  if(m.d126 != null) sc += m.d126 > 0 ? 1 : -1;
  if(m.lr && m.lr.r2 >= 0.55) sc += m.lr.slope > 0 ? 1 : -1;
  if(m.rsi != null){ if(m.rsi > 72) sc -= 1; else if(m.rsi < 28) sc += (above200 === false ? -1 : 1); }
  const signal = sc>=4 ? 'strong' : sc>=2 ? 'positive' : sc>=-1 ? 'neutral' : sc>=-3 ? 'caution' : 'weak';
  let trend;
  if(m.sma200 == null) trend = 'na';
  else if(m.lr && m.lr.r2>=0.65 && m.lr.annualPct>=4 && m.lr.annualPct<=45 && m.vol!=null && m.vol<22) trend='steady';
  else if(above200 && m.sma50!=null && m.p>m.sma50 && golden) trend='up';
  else if(!above200 && m.sma50!=null && m.p<m.sma50 && golden===false) trend='down';
  else if(m.sma50!=null && m.p>m.sma50 && above200===false) trend='recovery';
  else trend='side';
  let risk = 'na';
  if(m.vol != null){
    let tier = m.vol<12 ? 0 : m.vol<20 ? 1 : m.vol<32 ? 2 : 3;
    if(type === 'stock' && tier < 1) tier = 1;
    if(m.dd != null && m.dd <= -40 && tier < 3) tier += 1;
    risk = ['low','med','high','vhigh'][tier];
  }
  return {score:sc, signal, trend, risk};
}
const SIG_RANK = {weak:0, caution:1, neutral:2, positive:3, strong:4};
const RISK_RANK = {low:0, med:1, high:2, vhigh:3, na:9};
function riskTierOf(vol, type){
  if(vol==null) return 'na';
  let tier = vol<12 ? 0 : vol<20 ? 1 : vol<32 ? 2 : 3;
  if(type==='stock' && tier<1) tier=1;
  return ['low','med','high','vhigh'][tier];
}
async function scanUniverse(force){
  if(scanning){ scanAbort = true; return; }   // tapping again stops the scan
  scanAbort = false;
  const fresh = scanData.at && (Date.now()-scanData.at) < Math.max(1,+settings.scanHours||3)*3600000;
  if(!force && fresh && Object.keys(scanData.items||{}).length){ renderMovers(); return; }
  scanning = true;
  const btn=$('#btnScan'); btn.classList.add('spin'); btn.title = t('mv_stop');
  const bar=$('#mvProgress'); bar.classList.remove('hidden');
  const prev = (scanData && scanData.items) || {};
  const maxAge = Math.max(1, +settings.scanHours||3)*3600000;
  const full = SCAN_LIST();
  const items = {};
  for(const u of full){ if(prev[u.sym]) items[u.sym] = prev[u.sym]; }
  const queue = full.filter(u => !isDead(u.sym) && (force || !items[u.sym] || (Date.now()-items[u.sym].at) > maxAge));
  let done=0, ok=0;
  const total = queue.length;
  if(!total){ scanning=false; btn.classList.remove('spin'); bar.classList.add('hidden'); renderMovers(); return; }
  /* same object reference, so the leagues can render while it fills up */
  scanData = {at: scanData.at || Date.now(), ok: Object.keys(items).length, total: full.length, items};
  scanProg = {done:0, total, ok:0};
  const tick = () => {
    scanProg = {done, total, ok};
    bar.firstElementChild.style.width = (done/total*100).toFixed(1)+'%';
    if(done % 10 === 0 || done === total) renderMovers(); else $('#mvMeta').textContent = t('mv_scanning')+' '+done+'/'+total;
  };
  tick();
  const failed = [];
  async function worker(){
    while(queue.length){
      if(scanAbort){ queue.length = 0; break; }
      const u = queue.shift();
      try{
        const j = await viaProxy(chartUrl(u.sym, '1y'));
        const d = parseChart(j), c = d.c;
        items[u.sym] = scanItem(d);
        ok++;
      }catch(e){ failed.push(u); /* skipped on purpose: never fake a mover with demo data */ }
      done++; tick();
      await sleep(140);
    }
  }
  await Promise.all([worker(), worker(), worker()]);
  /* one retry pass: free proxies drop requests under load, and a skipped row
     silently changes the ranking, so it is worth asking twice before giving up */
  if(!scanAbort && failed.length){
    for(const u of failed){
      if(scanAbort) break;
      await sleep(300);
      try{
        const j = await viaProxy(chartUrl(u.sym, '1y'));
        const d = parseChart(j), c = d.c;
        items[u.sym] = scanItem(d);
        ok++; tick();
      }catch(e){}
    }
  }
  const wasAborted = scanAbort;
  scanning=false; scanAbort=false;
  btn.classList.remove('spin'); btn.title='';
  bar.classList.add('hidden');
  const freshCount = Object.values(items).filter(x => (Date.now()-x.at) <= maxAge).length;
  scanData = {at:Date.now(), ok:freshCount, total:full.length, items};
  try{ store.set('scan', scanData); }catch(e){}
  renderMovers();
  if(wasAborted) toast(t('mv_aborted'));
}
function median(a){
  if(!a.length) return null;
  const s=a.slice().sort((x,y)=>x-y), h=s.length>>1;
  return s.length%2 ? s[h] : (s[h-1]+s[h])/2;
}
/* ETFs and single stocks are ranked in separate leagues: a broad index fund
   moving 1.5% is a big day, a single stock moving 1.5% is a Tuesday. */
/* one place that turns a fetched series into the row the app works with */
function daysAboveSma(c, n){
  const s = smaSeries(c, n); let k = 0;
  for(let i=c.length-1; i>=0; i--){ if(s[i]!=null && c[i]>s[i]) k++; else break; }
  return k;
}
function scanItem(d){
  const c = d.c, r2 = v => v==null ? null : Math.round(v*10000)/10000;
  return {
    p:c[c.length-1], cur:d.cur||'EUR', yname:d.name||'',
    d1:pctBack(c,1), d5:pctBack(c,5), d21:pctBack(c,21), d63:pctBack(c,63),
    d126:pctBack(c,126), d252:pctBack(c,252),
    vol:annVol(c), dd:maxDD(c), lr:linregLog(c,120),
    sma20:r2(smaLast(c,20)), sma50:r2(smaLast(c,50)), sma200:r2(smaLast(c,200)),
    ema20:r2(emaLast(c,20)),
    rsi:rsi14(c),
    turn:turnover(c, d.v, 20),
    above20:daysAboveSma(c,20), hi52:r2(high52(c)), n:c.length,
    spark:c.slice(-30).map(v=>Math.round(v*100)/100),
    at:Date.now()
  };
}
function moverRows(type, limit){
  const per = settings.mvPeriod, dir = settings.mvDir;
  const rows = SCAN_LIST().filter(u => u.type===type)
    .map(u => ({u, m: scanData.items[u.sym]}))
    .filter(x => x.m && x.m[per]!=null && isFinite(x.m[per]));
  rows.sort((a,b) => dir==='up' ? b.m[per]-a.m[per] : a.m[per]-b.m[per]);
  return {rows: rows.slice(0, limit||10), total: rows.length,
          med: median(rows.map(x=>x.m[per]))};
}
function nameLooksOff(cat, yah){
  if(!yah) return false;
  const norm = s => String(s).toLowerCase()
    .replace(/ä/g,'a').replace(/ö/g,'o').replace(/ü/g,'u').replace(/ß/g,'ss')
    .replace(/ae/g,'a').replace(/oe/g,'o').replace(/ue/g,'u').replace(/ss/g,'s')
    .replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
  const a = norm(cat), b = norm(yah);
  if(!a || !b) return false;
  if(b.indexOf(a)>=0 || a.indexOf(b)>=0) return false;
  const toks = a.split(' ').filter(w=>w.length>=4);
  if(!toks.length) return false;
  return !toks.some(w => b.indexOf(w.slice(0,Math.min(w.length,6)))>=0);
}

function renderMovers(){

/* =====================================================================
   SCREENER — filter the scanned universe on measurable conditions
   ===================================================================== */
const SCREEN_PRESETS = {
  trade:   {type:'stock', above:'ema20',  day:'',  month:'5', rsiMin:'40', rsiMax:'',   minp:'10', minturn:'', mom:'any',   mcap:'', signal:'any', trend:'any', risk:'any', sort:'d21'},
  invest:  {type:'all',   above:'sma200', day:'',  month:'',  rsiMin:'',   rsiMax:'',   minp:'10', minturn:'', mom:'any',   mcap:'', signal:'any', trend:'any', risk:'any', sort:'d252'},
  breakout:{type:'stock', above:'sma20',  day:'4', month:'',  rsiMin:'40', rsiMax:'70', minp:'10', minturn:'', mom:'any',   mcap:'', signal:'any', trend:'any', risk:'any', sort:'d1'},
  momentum:{type:'stock', above:'sma20',  day:'',  month:'0', rsiMin:'40', rsiMax:'70', minp:'10', minturn:'', mom:'start', mcap:'', signal:'any', trend:'any', risk:'any', sort:'d5'}
};
const SCREEN_DEFAULT = Object.assign({preset:'trade'}, SCREEN_PRESETS.trade);
const SCREEN_FIELDS = {scPreset:'preset', scType:'type', scAbove:'above', scDay:'day', scMonth:'month',
  scRsiMin:'rsiMin', scRsiMax:'rsiMax', scMinp:'minp', scTurn:'minturn', scMcap:'mcap', scMom:'mom',
  scSignal:'signal', scTrend:'trend', scRisk:'risk', scSort:'sort'};
/* An empty box means "no limit", so any number the user types is accepted
   instead of only the handful a dropdown could offer.                    */
function numOrNull(v){
  if(v === '' || v === null || v === undefined || v === 'any') return null;
  const n = Number(String(v).replace(',', '.'));
  return isFinite(n) ? n : null;
}
let mcapCache = store.get('mcap', {});
let screenBusy = false;

/* "starting to rise": the short-term structure has turned up, but not long ago,
   and momentum is not yet exhausted. Deliberately excludes names that have been
   running for months - those are already priced in.                            */
function momentumStart(m){
  return m.sma20!=null && m.sma50!=null && m.rsi!=null && m.d21!=null
    && m.p > m.sma20 && m.sma20 > m.sma50
    && m.above20 >= 2 && m.above20 <= 25
    && m.rsi >= 45 && m.rsi <= 72
    && m.d21 > 0;
}
function screenFilters(){ return Object.assign({}, SCREEN_DEFAULT, settings.screen || {}); }
let screenFunnel = [];
/* A filter only rejects an asset when the number it needs actually exists.
   Yahoo often reports no volume for Xetra listings, and treating "unknown"
   as "fails" silently emptied the entire screener.                          */
function screenRows(){
  const f = screenFilters();
  const items = (scanData && scanData.items) || {};
  let list = [];
  for(const u of SCAN_LIST()){ const m = items[u.sym]; if(m) list.push({u, m}); }
  screenFunnel = [{label:t('sc_all'), before:list.length, after:list.length, unknown:0}];
  const step = (label, active, test, metric) => {
    if(!active) return;
    const before = list.length;
    let unknown = 0;
    list = list.filter(x => {
      if(metric && metric(x) == null){ unknown++; return true; }   // unmeasured never means rejected
      return test(x);
    });
    screenFunnel.push({label, before, after:list.length, unknown});
  };
  step(t('sc_type'), f.type !== 'all', x => x.u.type === f.type, null);
  step(t('sc_above') + ' ' + String(f.above).toUpperCase(), f.above !== 'any',
       x => x.m.p > x.m[f.above], x => x.m[f.above]);
  const nDay=numOrNull(f.day), nMon=numOrNull(f.month), nRmin=numOrNull(f.rsiMin),
        nRmax=numOrNull(f.rsiMax), nMinp=numOrNull(f.minp),
        nTurn=numOrNull(f.minturn), nCap=numOrNull(f.mcap);
  step(t('sc_day')+' >'+nDay,   nDay!=null, x => x.m.d1  > nDay,  x => x.m.d1);
  step(t('sc_month')+' >'+nMon, nMon!=null, x => x.m.d21 > nMon,  x => x.m.d21);
  step('RSI ≥'+nRmin, nRmin!=null, x => x.m.rsi >= nRmin, x => x.m.rsi);
  step('RSI ≤'+nRmax, nRmax!=null, x => x.m.rsi <= nRmax, x => x.m.rsi);
  step(t('sc_minp'), nMinp!=null, x => x.m.p >= nMinp, x => x.m.p);
  step(t('sc_turn'), nTurn!=null, x => x.m.turn >= nTurn, x => x.m.turn);
  step(t('sc_signal'), f.signal && f.signal !== 'any',
       x => SIG_RANK[(scanScore(x.m, x.u.type)||{}).signal] >= SIG_RANK[f.signal], null);
  step(t('sc_trend'), f.trend && f.trend !== 'any',
       x => (scanScore(x.m, x.u.type)||{}).trend === f.trend, null);
  step(t('sc_risk'), f.risk && f.risk !== 'any',
       x => RISK_RANK[(scanScore(x.m, x.u.type)||{}).risk] <= RISK_RANK[f.risk], null);
  step(t('sc_mom'),  f.mom === 'start', x => momentumStart(x.m), null);
  step(t('sc_mcap'), nCap!=null, x => mcapCache[x.u.sym] >= nCap,
       x => mcapCache[x.u.sym] === undefined ? null : mcapCache[x.u.sym]);
  const key = f.sort;
  const val = x => key === 'name' ? 0
    : key === 'score' ? ((scanScore(x.m, x.u.type)||{}).score ?? -99)
    : (x.m[key] != null ? x.m[key] : -1e15);
  list.sort((a,b) => key === 'name'
    ? (a.u.name||a.u.sym).localeCompare(b.u.name||b.u.sym)
    : val(b) - val(a));
  if((settings.screen||{}).dir === 'asc') list.reverse();
  return list;
}
function funnelHtml(){
  if(screenFunnel.length < 2) return '';
  return '<div class="funnel">' + screenFunnel.map(s => {
    const cut = s.before - s.after;

      + (cut?`<i>−${cut}</i>`:'') + (s.unknown?`<u title="${t('sc_unknown')}">?${s.unknown}</u>`:'') + '</span>';
  }).join('<span class="fn-arrow">→</span>') + '</div>';
}
/* market cap is not in the chart endpoint, so it is fetched only for the rows
   that already survived every other filter - and only when actually asked for */
async function loadMcaps(rows){
  const todo = rows.filter(x => mcapCache[x.u.sym] === undefined).slice(0, 60);
  if(!todo.length) return 0;
  screenBusy = true; renderScreen();
  let got = 0;
  for(const x of todo){
    try{
      const j = await viaProxy('https://query1.finance.yahoo.com/v10/finance/quoteSummary/'
        + encodeURIComponent(x.u.sym) + '?modules=price');
      const res = j && j.quoteSummary && j.quoteSummary.result && j.quoteSummary.result[0];
      const raw = res && res.price && res.price.marketCap && res.price.marketCap.raw;
      mcapCache[x.u.sym] = isFinite(raw) ? raw : null;
      if(isFinite(raw)) got++;
    }catch(e){ mcapCache[x.u.sym] = null; }
    await sleep(160);
  }
  try{ store.set('mcap', mcapCache); }catch(e){}
  screenBusy = false;
  return got;
}

function openTR(isin, sym){

    if(a){ a.isin = isin; store.set('watchlist', watchlist); renderWl(); renderAll(); }
  }

     direct link often lands on a default page instead of the security clicked.
     Copying the ISIN turns the fallback - paste into TR's search - into a
     two-second job rather than a dead end.                                  */
  copySilent(isin);

    toast(t('tr_copied_only'));

  }

  const android = ua.indexOf('Android') >= 0;
