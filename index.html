      + '#Intent;scheme=https;package=de.traderepublic.app;S.browser_fallback_url='
      + encodeURIComponent(url) + ';end';
    return;
  }
  window.open(url, '_blank', 'noopener');
}

/* =====================================================================
   PLANNER — allocation suggestion + Monte-Carlo scenarios
   ===================================================================== */
const PROFILES = {
  safe:     {ceil:1, core:0.85, maxPos:4, maxW:0.55, stocks:false, minScore:1},
  balanced: {ceil:2, core:0.65, maxPos:5, maxW:0.34, stocks:true,  minScore:0},
  growth:   {ceil:3, core:0.45, maxPos:6, maxW:0.28, stocks:true,  minScore:-1}
};
const RISK_TIER = {low:0, med:1, high:2, vhigh:3, na:9};
const ANCHOR = {etf:0.07, stock:0.06};
let planState = null;

function rhoOf(x,y){
  if(x.type==='etf' && y.type==='etf') return 0.80;
  if(x.type==='stock' && y.type==='stock') return 0.55;
  return 0.65;
}
function trendOf(a){
  const anchor = ANCHOR[a.type] || 0.06;
  return clamp(a.lr ? a.lr.annualPct/100 : anchor, -0.25, 0.35);
}
/* running costs come straight off the return, every year, whatever the market does */
function terFrac(asset){ const v = terOf(asset); return v==null ? 0 : v/100; }
function buildPlan(){
  const amount = clamp(+settings.planAmount||0, 1, 1e7);
  const monthly = clamp(+settings.planMonthly||0, 0, 1e5);
  const prof = settings.planProfile in PROFILES ? settings.planProfile : 'balanced';
  const P = PROFILES[prof];
  const excluded = [];
  const cand = [];
  for(const asset of watchlist){
    const a = analyses[asset.sym]; if(!a) continue;
    if(a.signal === 'weak'){ excluded.push({asset, why:'p_ex_weak'}); continue; }
    if(asset.type === 'stock' && !P.stocks){ excluded.push({asset, why:'p_ex_risk'}); continue; }
    if(RISK_TIER[a.risk] > P.ceil){ excluded.push({asset, why:'p_ex_risk'}); continue; }
    if(a.score < P.minScore){ excluded.push({asset, why:'p_ex_score'}); continue; }
    cand.push({asset, a});
  }
  const rank = (x,y) => (y.a.score - x.a.score)
    || ((y.a.lr?y.a.lr.r2:0) - (x.a.lr?x.a.lr.r2:0))
    || (RISK_TIER[x.a.risk] - RISK_TIER[y.a.risk]);
  let cores = cand.filter(x => x.asset.type==='etf').sort(rank);
  const sats  = cand.filter(x => x.asset.type==='stock').sort(rank);
  /* Two MSCI World trackers hold nearly the same companies, so holding both buys no
     diversification - only the higher fee. Keep the cheapest of each category whose
     signal is within one point of the best, and say why the others dropped out.     */
  const byCat = {};
  cores.forEach(x => { const c = catOf(x.asset); (byCat[c] = byCat[c] || []).push(x); });
  cores = Object.keys(byCat).map(c => {
    const g = byCat[c], best = g[0];
    const pick = g.filter(x => x.a.score >= best.a.score - 1)
                  .sort((u,v) => (terOf(u.asset) ?? 0.5) - (terOf(v.asset) ?? 0.5))[0] || best;
    pick.cheapest = g.length > 1;
    g.filter(x => x !== pick).forEach(x => excluded.push({asset:x.asset, why:'p_ex_cost'}));
    return pick;
  }).sort(rank);
  const nCore = Math.min(cores.length, Math.max(1, Math.ceil(P.maxPos*0.6)));
  const nSat  = Math.min(sats.length, P.maxPos - nCore);
  let picks = cores.slice(0,nCore).map(x => ({...x, core:true}))
        .concat(sats.slice(0,nSat).map(x => ({...x, core:false})));
  cores.slice(nCore).concat(sats.slice(nSat)).forEach(x => excluded.push({asset:x.asset, why:'p_ex_room'}));
  if(!picks.length) return {empty:true, excluded, amount, monthly, prof};

  const coreShare = picks.some(p=>p.core) && picks.some(p=>!p.core) ? P.core : 1;
  function weigh(list, budget){
    const raw = list.map(p => Math.max(0.5, p.a.score + 5));
    const sum = raw.reduce((s,v)=>s+v,0) || 1;
    list.forEach((p,i) => p.w = budget * raw[i]/sum);
  }
  weigh(picks.filter(p=>p.core), coreShare);
  weigh(picks.filter(p=>!p.core), 1-coreShare);
  picks.forEach(p => p.rawW = p.w);
  for(let iter=0; iter<8; iter++){
    let over = 0;
    picks.forEach(p => { if(p.w > P.maxW + 1e-9){ over += p.w - P.maxW; p.w = P.maxW; } });
    if(over < 1e-9) break;
    const room = picks.filter(p => p.w < P.maxW - 1e-9);
    if(!room.length) break;
    const roomSum = room.reduce((s,p)=>s+p.w,0) || room.length;
    room.forEach(p => p.w += over*(roomSum? p.w/roomSum : 1/room.length));
  }
  const wSum = picks.reduce((s,p)=>s+p.w,0) || 1;
  picks.forEach(p => { p.w /= wSum; p.capped = p.w < p.rawW - 0.005; });
  const minW = Math.max(0.05, Math.min(0.12, 15/amount));
  const kept = picks.filter(p => p.w >= minW);
  if(kept.length && kept.length < picks.length){
    picks.filter(p => p.w < minW).forEach(p => excluded.push({asset:p.asset, why:'p_ex_small'}));
    const s = kept.reduce((s,p)=>s+p.w,0) || 1;
    kept.forEach(p => p.w /= s);
    picks = kept;
  }
  picks.forEach(p => { p.eur = amount * p.w; p.units = p.a.price>0 ? p.eur/p.a.price : null; });

  const pTer    = picks.reduce((s,p)=>s + p.w*terFrac(p.asset), 0);
  const pTrend  = picks.reduce((s,p)=>s + p.w*(trendOf(p.a) - terFrac(p.asset)), 0);
  const pAnchor = picks.reduce((s,p)=>s + p.w*((ANCHOR[p.asset.type]||0.06) - terFrac(p.asset)), 0);
  let varSum = 0;
  for(let i=0;i<picks.length;i++) for(let j=0;j<picks.length;j++){
    const si=(picks[i].a.vol||18)/100, sj=(picks[j].a.vol||18)/100;
    const r = i===j ? 1 : rhoOf(picks[i].asset, picks[j].asset);
    varSum += picks[i].w*picks[j].w*si*sj*r;
  }
  const sigma = Math.max(0.03, Math.sqrt(varSum));
  const riskTier = sigma<0.12 ? 'low' : sigma<0.20 ? 'med' : sigma<0.32 ? 'high' : 'vhigh';
  const sim = simulate(amount, monthly, pTrend, pAnchor, sigma, picks.map(p=>p.asset.sym).join('|')+prof+amount+monthly);
  const demo = picks.some(p => p.a.demo);
  return {picks, excluded, amount, monthly, prof, P, sigma, riskTier, pTrend, pAnchor, pTer, sim, demo, coreShare};
}
/* trend fades into the long-run anchor with a ~2-year half-life */
function driftAt(years, trend, anchor){ const w = Math.exp(-years/2); return w*trend + (1-w)*anchor; }
function simulate(P0, monthly, trend, anchor, sigma, seed){
  const N = 2000, M = 120, rnd = mulberry32(strHash(seed));
  const sm = sigma/Math.sqrt(12);
  const mu = []; for(let m=0;m<M;m++){ const d=driftAt(m/12, trend, anchor); mu.push(Math.log(1+d)/12 - sm*sm/2); }
  const marks = [1,6,12,36,60,120];
  const chartM = []; for(let m=0;m<=M;m+=2) chartM.push(m);
  const atMark = marks.map(()=>new Float64Array(N));
  const atChart = chartM.map(()=>new Float64Array(N));
  let spare = null;
  const gauss = () => { if(spare!==null){ const s=spare; spare=null; return s; }
    let u=0,v=0,s=0; do{ u=rnd()*2-1; v=rnd()*2-1; s=u*u+v*v; }while(s===0||s>=1);
    const f=Math.sqrt(-2*Math.log(s)/s); spare=v*f; return u*f; };
  for(let i=0;i<N;i++){
    let val = P0;
    let ci = 0; if(chartM[0]===0) atChart[ci++][i] = val;
    let mi = 0;
    for(let m=0;m<M;m++){
      val = val*Math.exp(mu[m] + sm*gauss()) + monthly;
      const mm = m+1;
      if(mi<marks.length && marks[mi]===mm) atMark[mi++][i] = val;
      if(ci<chartM.length && chartM[ci]===mm) atChart[ci++][i] = val;
    }
  }
  const pct = (arr,q) => { const s=Float64Array.from(arr).sort(); return s[clamp(Math.round(q*(s.length-1)),0,s.length-1)]; };
  const paid = m => P0 + monthly*m;
  return {
    rows: marks.map((m,i)=>({m, key:['h_1m','h_6m','h_1y','h_3y','h_5y','h_10y'][i],
      p10:pct(atMark[i],0.10), p50:pct(atMark[i],0.50), p90:pct(atMark[i],0.90), paid:paid(m)})),
    chart: chartM.map((m,i)=>({m, p10:pct(atChart[i],0.10), p50:pct(atChart[i],0.50), p90:pct(atChart[i],0.90), paid:paid(m)}))
  };
}
function explainPlan(pl){
  const de = settings.lang==='de', o=[], profName = t('p_prof_'+pl.prof).replace(/\s*\(.*\)$/,'');
  o.push(de?`Profil <strong>${escHtml(profName)}</strong>: höchstens Risikostufe „${LABELS.risk[['low','med','high','vhigh'][pl.P.ceil]][settings.lang].replace(/^Risiko: /,'')}", maximal ${pl.P.maxPos} Positionen, höchstens ${fmtPct(pl.P.maxW*100,{signed:false,d:0})} je Position.`
            :`Profile <strong>${escHtml(profName)}</strong>: risk level at most "${LABELS.risk[['low','med','high','vhigh'][pl.P.ceil]][settings.lang].replace(/^Risk: /,'')}", up to ${pl.P.maxPos} positions, max ${fmtPct(pl.P.maxW*100,{signed:false,d:0})} each.`);
  if(pl.picks.some(p=>p.core) && pl.picks.some(p=>!p.core))
    o.push(de?`Aufbau Kern/Satellit: ${fmtPct(pl.coreShare*100,{signed:false,d:0})} breite ETFs als Basis, der Rest Einzelwerte mit dem stärksten Signal.`
              :`Core/satellite build: ${fmtPct(pl.coreShare*100,{signed:false,d:0})} broad ETFs as the base, the rest single names with the strongest signal.`);
  const cheap = pl.picks.filter(p=>p.cheapest && terOf(p.asset)!=null);
  if(cheap.length) o.push(settings.lang==='de'
    ? `Bei austauschbaren Indexfonds entscheidet der Preis: ausgewählt wurde jeweils der günstigste Tracker seiner Kategorie (${cheap.map(p=>escHtml(p.asset.name||p.asset.sym)+', '+fmtNum(terOf(p.asset),2)+' %').join(' · ')}). Teurere Zwillinge stehen unten bei den aussortierten Werten.`
    : `Where index funds are interchangeable, price decides: the cheapest tracker of each category was picked (${cheap.map(p=>escHtml(p.asset.name||p.asset.sym)+', '+fmtNum(terOf(p.asset),2)+'%').join(' · ')}). Pricier twins appear below among the dropped assets.`);
  pl.picks.forEach(p=>{
    const a=p.a, bits=[];
    bits.push(de?`Signal ${a.score>0?'+':''}${a.score}`:`signal ${a.score>0?'+':''}${a.score}`);
    bits.push(LABELS.trend[a.trend][settings.lang].toLowerCase());
    if(a.vol!=null) bits.push((de?'Vola ':'vol ')+fmtPct(a.vol,{signed:false,d:0}));
    if(terOf(p.asset)!=null) bits.push('TER '+fmtNum(terOf(p.asset),2)+' %');
    o.push(`<strong>${escHtml(p.asset.name||p.asset.sym)}</strong> — ${fmtMoney(p.eur,'EUR')} (${fmtPct(p.w*100,{signed:false,d:0})}): ${bits.join(', ')}.${p.capped?(de?' Auf die Obergrenze gedeckelt.':' Capped at the position limit.'):''}`);
  });
  o.push(de?`Zusammen ergibt das eine geschätzte Schwankung von <strong>${fmtPct(pl.sigma*100,{signed:false})} p.a.</strong> – weniger als der Durchschnitt der Einzelwerte, weil sie sich nicht im Gleichschritt bewegen (angenommene Korrelation 0,55–0,80).`
            :`Together that gives an estimated volatility of <strong>${fmtPct(pl.sigma*100,{signed:false})} p.a.</strong> - less than the average of the single names, because they do not move in lockstep (assumed correlation 0.55-0.80).`);
  return o;
}
function assumpPlan(pl){
  const de = settings.lang==='de', o=[];
  o.push(de?`Startrendite je Wert = aktueller 120-Tage-Trend, gekappt auf −25 % bis +35 % p.a. Diese Trendannahme <strong>verblasst mit rund zwei Jahren Halbwertszeit</strong> in eine langfristige Marktannahme (ETF 7 %, Einzelaktie 6 % p.a.). Sonst würde ein heute steiler Wert über 10 Jahre absurde Zahlen liefern.`
            :`Starting return per asset = current 120-day trend, capped at -25% to +35% p.a. That trend assumption <strong>fades with roughly a two-year half-life</strong> into a long-run market assumption (ETF 7%, single stock 6% p.a.). Otherwise a steep mover today would produce absurd 10-year numbers.`);
  o.push(de?`Die Spannen stammen aus 2.000 simulierten Kursverläufen (Monatsschritte, Zufallsschwankung mit ${fmtPct(pl.sigma*100,{signed:false})} p.a.). „Schwach" heißt: 10 % der Verläufe waren noch schlechter. „Gut": 10 % waren besser.`
            :`The ranges come from 2,000 simulated paths (monthly steps, random fluctuation at ${fmtPct(pl.sigma*100,{signed:false})} p.a.). "Poor" means 10% of paths were worse still. "Good": 10% were better.`);
  o.push(de?`Die laufenden Fondskosten sind bereits abgezogen: <strong>${fmtNum(pl.pTer*100,2)} % p.a.</strong> für dieses Depot, über 10 Jahre rund ${fmtMoney(pl.amount*(1-Math.pow(1-pl.pTer,10)),'EUR')} bei ${fmtMoney(pl.amount,'EUR')} Anlage. Kosten sind der einzige Teil der Rechnung, der sicher eintritt.`
            :`Ongoing fund costs are already deducted: <strong>${fmtNum(pl.pTer*100,2)}% p.a.</strong> for this portfolio, roughly ${fmtMoney(pl.amount*(1-Math.pow(1-pl.pTer,10)),'EUR')} over 10 years on ${fmtMoney(pl.amount,'EUR')} invested. Costs are the only part of this calculation that is certain to happen.`);
  o.push(de?`Nicht enthalten: Steuern (Kapitalertragsteuer, Vorabpauschale), Ordergebühren, Wechselkurse, Dividenden bei ausschüttenden Werten sowie jede Nachricht, die es noch nicht gibt.`
            :`Not included: taxes, order fees, currency moves, dividends on distributing assets, and any news that has not happened yet.`);
  o.push(de?`<strong>Das ist keine Anlageberatung und keine Prognose</strong>, sondern eine Rechenübung mit klar benannten Annahmen. Der schwache Pfad ist genauso realistisch wie der gute.`
            :`<strong>This is not investment advice and not a forecast</strong>, but arithmetic with clearly stated assumptions. The poor path is exactly as realistic as the good one.`);
  return o;
}
function renderPlan(){
  const box = $('#planOut');
  planState = buildPlan();
  const pl = planState;
  const exHtml = pl.excluded.length
    ? `<p class="excl"><b>${t('p_excluded')}</b> ` + pl.excluded.slice(0,10).map(e=>`${escHtml(e.asset.name||e.asset.sym)} <span style="opacity:.75">(${t(e.why)})</span>`).join(' · ') + `</p>` : '';
  if(pl.empty){ box.innerHTML = `<div class="plan-empty">${t('p_none')}</div>${exHtml}`; return; }
  const rows = pl.picks.map(p=>`
    <tr class="${p.core?'core-row':'sat-row'}" data-sym="${escHtml(p.asset.sym)}">
      <td><span class="aname">${escHtml(p.asset.name||p.asset.sym)}</span>
        <span class="asub">${escHtml(p.asset.sym)}${p.asset.isin?' · '+escHtml(p.asset.isin):''}</span>
        <div class="wbar"><i class="${p.core?'':'sat'}" style="width:${(p.w*100).toFixed(1)}%"></i></div></td>
      <td class="num">${fmtPct(p.w*100,{signed:false,d:1})}</td>
      <td class="num"><strong>${fmtMoney(p.eur,'EUR')}</strong></td>
      <td class="num hide-s">${p.units!=null?fmtNum(p.units, p.units<10?3:2):'–'}</td>
      <td class="num hide-s">${terOf(p.asset)!=null?fmtNum(terOf(p.asset),2)+' %':'–'}</td>
      <td class="hide-s"><span class="badge b-sig s-${p.a.signal}">${escHtml(LABELS.signal[p.a.signal][settings.lang])}</span></td>
      <td class="hide-s"><span class="badge b-risk ${RISK_CLS[p.a.risk]||''}">${escHtml(LABELS.risk[p.a.risk][settings.lang].replace(/^(Risiko|Risk): /,''))}</span></td>
      <td class="num">${p.asset.isin?`<a class="trlink" data-go="tr" data-isin="${escHtml(p.asset.isin)}" data-sym="${escHtml(p.asset.sym)}" target="_blank" rel="noopener" href="${escHtml(trUrl(p.asset.isin))}">TR</a> `:''}<a class="trlink" data-go="tv" data-sym="${escHtml(p.asset.sym)}" target="_blank" rel="noopener" href="${escHtml(tvUrl(p.asset.sym))}">TV</a></td>
    </tr>`).join('');
  const orow = r=>{
    const gain = r.p50 - r.paid;
    return `<tr class="${r.m===12||r.m===120?'out-row-hi':''}">
      <td>${t(r.key)}</td>
      <td class="num">${fmtMoney(r.paid,'EUR')}</td>
      <td class="num down">${fmtMoney(r.p10,'EUR')}</td>
      <td class="num"><strong class="${gain>0?'up':gain<0?'down':''}">${fmtMoney(r.p50,'EUR')}</strong></td>
      <td class="num up">${fmtMoney(r.p90,'EUR')}</td>
    </tr>`; };
  box.innerHTML = `
    ${pl.demo?`<div class="plan-warn">${t('p_demo_warn')}</div>`:''}
    <div class="set-group">
      <h3 data-i18n="p_mix">${t('p_mix')}</h3>
      <div class="pf-head">
        <span class="big mono">${fmtMoney(pl.amount,'EUR')}</span>
        ${pl.monthly>0?`<span class="mono" style="color:var(--muted)">+ ${fmtMoney(pl.monthly,'EUR')}/M</span>`:''}
        <span class="badge b-risk ${RISK_CLS[pl.riskTier]}">${t('p_portrisk')}: ${fmtPct(pl.sigma*100,{signed:false})}</span>
        <span class="badge">${t('p_positions')}: ${pl.picks.length}</span>
        <span class="badge">TER ${fmtNum(pl.pTer*100,2)} % · ${t('p_costs10')} ${fmtMoney(pl.amount*(1-Math.pow(1-pl.pTer,10)),'EUR')}</span>
      </div>
      <table class="tbl"><thead><tr>
        <th>${t('p_col_asset')}</th><th class="num">${t('p_col_weight')}</th><th class="num">${t('p_col_eur')}</th>
        <th class="num hide-s">${t('p_col_units')}</th><th class="num hide-s">TER</th><th class="hide-s">${t('p_col_sig')}</th><th class="hide-s">${t('p_col_risk')}</th><th></th>
      </tr></thead><tbody>${rows}</tbody></table>
      <p class="excl">${t('p_frac')}</p>
      ${exHtml}
    </div>

    <div class="set-group">
      <h3>${t('p_outcome')}</h3>
      <canvas id="planChart"></canvas>
      <div class="legend">
        <span><i style="background:${hexA(cssVar('--accent'),0.55)}"></i>${t('p_legend_band')}</span>
        <span><i style="background:${cssVar('--accent')}"></i>${t('p_legend_mid')}</span>
        <span><i style="background:${cssVar('--faint')}"></i>${t('p_legend_paid')}</span>
      </div>
      <table class="tbl" style="margin-top:14px"><thead><tr>
        <th>${t('p_col_hor')}</th><th class="num">${t('p_col_paid')}</th><th class="num">${t('p_col_bad')}</th>
        <th class="num">${t('p_col_mid')}</th><th class="num">${t('p_col_good')}</th>
      </tr></thead><tbody>${pl.sim.rows.map(orow).join('')}</tbody></table>
    </div>

    <div class="set-group"><h3>${t('p_why')}</h3><ul class="why">${explainPlan(pl).map(x=>`<li>${x}</li>`).join('')}</ul></div>
    <div class="set-group"><h3>${t('p_assump')}</h3><ul class="why">${assumpPlan(pl).map(x=>`<li>${x}</li>`).join('')}</ul></div>`;
  requestAnimationFrame(drawPlanChart);
}
function drawPlanChart(){
  const cv = $('#planChart'); if(!cv || !planState || planState.empty) return;
  const dpr=window.devicePixelRatio||1, r=cv.getBoundingClientRect(); if(r.width<10) return;
  cv.width=r.width*dpr; cv.height=r.height*dpr;
  const ctx=cv.getContext('2d'); ctx.scale(dpr,dpr);
  const W=r.width, H=r.height; ctx.clearRect(0,0,W,H);
  const pts=planState.sim.chart, padL=52, padR=8, padT=10, padB=22;
  const X=m=>padL+(W-padL-padR)*(m/120);
  let hi=0; pts.forEach(p=>{ if(p.p90>hi) hi=p.p90; });
  hi*=1.04; const lo=0;
  const Y=v=>padT+(H-padT-padB)*(1-(v-lo)/(hi-lo||1));
  ctx.font='11px ui-monospace, monospace'; ctx.fillStyle=cssVar('--faint');
  for(let i=0;i<=4;i++){
    const v=hi*i/4, y=Y(v);
    ctx.strokeStyle=cssVar('--grid'); ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(W-padR,y); ctx.stroke();
    ctx.fillText(v>=10000?fmtNum(v/1000,0)+'k':fmtNum(v,0), 4, y+4);
  }
  for(let yr=0; yr<=10; yr+=2){
    const x=X(yr*12);
    ctx.strokeStyle=cssVar('--grid'); ctx.beginPath(); ctx.moveTo(x,padT); ctx.lineTo(x,H-padB); ctx.stroke();
    ctx.fillText(yr+(yr===10?' '+t('p_chart_x'):''), x-4, H-6);
  }
  ctx.beginPath();
  pts.forEach((p,i)=> i?ctx.lineTo(X(p.m),Y(p.p90)):ctx.moveTo(X(p.m),Y(p.p90)));
  for(let i=pts.length-1;i>=0;i--) ctx.lineTo(X(pts[i].m), Y(pts[i].p10));
  ctx.closePath(); ctx.fillStyle=hexA(cssVar('--accent'),0.15); ctx.fill();
  ctx.strokeStyle=cssVar('--faint'); ctx.lineWidth=1.2; ctx.setLineDash([4,4]);
  ctx.beginPath(); pts.forEach((p,i)=> i?ctx.lineTo(X(p.m),Y(p.paid)):ctx.moveTo(X(p.m),Y(p.paid))); ctx.stroke(); ctx.setLineDash([]);
  ctx.strokeStyle=cssVar('--accent'); ctx.lineWidth=2;
  if(dark()){ ctx.shadowColor=cssVar('--accent'); ctx.shadowBlur=6; }
  ctx.beginPath(); pts.forEach((p,i)=> i?ctx.lineTo(X(p.m),Y(p.p50)):ctx.moveTo(X(p.m),Y(p.p50))); ctx.stroke(); ctx.shadowBlur=0;
}

/* ---------------- init ---------------- */
applyView();
applyTheme();
bindEvents();
applyLang();
const gRec = store.get('guest', null);
if(gRec && gRec.until > Date.now() && guestSecret()){ guestUntil = gRec.until; unlock(true); }
else {
  store.del('guest');
  const keep = store.get('authed', 0);
  if(auth && keep){
    if(keep && keep.u){ isAdmin = !!keep.admin; currentUser = keep.u; }
    else { isAdmin = true; currentUser = 'admin'; }
    unlock();
  } else showLock();
}
</script>
